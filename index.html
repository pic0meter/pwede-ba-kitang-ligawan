<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b0a">
<title>Pwede Ba Kitang Ligawan — Kinetic Lyrics</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Coiny&family=Lilita+One&family=Poppins:wght@400;500;600;700;800;900&display=swap");
:root{
  --bg:#0d0b0a;--ink:#f8f0e6;--muted:#b6a99c;--accent:#ffb38a;
  --x:50%;--y:50%;--mx:0px;--my:0px;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);
  overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#app{
  position:relative;width:100vw;height:100dvh;overflow:hidden;
  background:
    radial-gradient(circle at var(--x) var(--y),#33241d 0,#171210 30%,#0d0b0a 70%);
  isolation:isolate;
}
#grain{
  position:absolute;inset:-50%;opacity:.055;pointer-events:none;z-index:30;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation:grain .18s steps(2) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}
  50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}
.ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{
  position:absolute;border-radius:50%;filter:blur(70px);opacity:.18;
  transition:transform .15s ease;will-change:transform;
}
.o1{width:38vw;height:38vw;background:#a75d3d;left:-12vw;top:10vh}
.o2{width:28vw;height:28vw;background:#70583c;right:-8vw;bottom:-6vh}

#top{
  position:absolute;left:4vw;right:4vw;top:3.5vh;display:flex;
  justify-content:space-between;align-items:center;z-index:10;
  font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#cfc1b4;
}
.title{display:flex;gap:10px;align-items:center}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 18px #ffb38a99;transition:transform .25s ease;
}
.playing .dot{transform:scale(1.45)}
.counter{opacity:.75}

#stage{
  position:absolute;inset:0;display:grid;place-items:center;
  padding:10vh 7vw 17vh;z-index:4;
}
.lyric{
  position:relative;width:min(1100px,90vw);height:min(48vh,430px);
  display:flex;align-items:center;justify-content:center;
}
.line{
  position:absolute;max-width:100%;text-align:center;
  opacity:0;transform:translateY(25px) scale(.965);
  filter:blur(8px);pointer-events:none;
  transition:
    opacity .32s ease,
    transform .65s cubic-bezier(.2,.8,.2,1),
    filter .45s ease;
  will-change:transform,opacity,filter;
}
.line.active{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
.line.out{
  opacity:0;transform:translateY(-35px) scale(1.035);filter:blur(6px);
}

.line.first-half-transition{
  transition:
    opacity .42s cubic-bezier(.22,.7,.25,1),
    transform .58s cubic-bezier(.22,.8,.22,1),
    filter .42s ease;
}
.line.first-half-transition.out{
  opacity:0;
  transform:translateY(-12px) scale(.985);
  filter:blur(3px);
}
.line.first-half-transition.active{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:blur(0);
}
.line.verse{
  font-size:clamp(28px,4.4vw,68px);font-weight:600;
  letter-spacing:-.045em;line-height:1.05;
}
.line.soft{
  font-size:clamp(25px,3.7vw,58px);font-weight:400;
  letter-spacing:-.04em;line-height:1.08;
}
.line.chorus{
  font-size:clamp(45px,8.7vw,132px);font-weight:800;
  letter-spacing:-.075em;line-height:.88;
}
.line.big{
  font-size:clamp(56px,11vw,170px);font-weight:800;
  letter-spacing:-.085em;line-height:.8;
}
.word{
  display:inline-block;margin:.03em .105em;
  opacity:.08;transform:translateY(.38em) scale(.94);
  filter:blur(5px);color:#d9cec4;
  transition:
    opacity .16s ease,
    transform .22s cubic-bezier(.2,.8,.2,1),
    filter .2s ease,color .2s ease,text-shadow .2s ease;
  will-change:transform,opacity,filter;
}
.word.visible{
  opacity:1;transform:translateY(0) scale(1);filter:blur(0);color:var(--ink);
}
.word.current{
  color:var(--accent);transform:translateY(-.055em) scale(1.06);
  text-shadow:0 0 28px #ffb38a55;
}
.word.accent,.word.visible.accent{color:var(--accent)}

.line.question-chaos.active{
  animation:firstChorusBob 1.02s cubic-bezier(.36,.07,.19,.97) infinite alternate !important;
}
@keyframes firstChorusBob{
  0%{transform:translate3d(-6px,4px,0) rotate(-.45deg) scale(1)}
  17%{transform:translate3d(5px,-7px,0) rotate(.65deg) scale(1.012)}
  36%{transform:translate3d(-4px,8px,0) rotate(-.8deg) scale(.994)}
  55%{transform:translate3d(7px,-4px,0) rotate(.55deg) scale(1.018)}
  74%{transform:translate3d(-5px,6px,0) rotate(-.65deg) scale(1.005)}
  100%{transform:translate3d(4px,-5px,0) rotate(.4deg) scale(1.012)}
}

#questionChaos{
  position:absolute;
  inset:0;
  z-index:6;
  pointer-events:none;
  overflow:visible;
  opacity:0;
}
#questionChaos.ready{opacity:1}
#questionChaos .qmark{
  position:absolute;
  left:var(--x);
  top:var(--y);
  font-family:var(--font, Inter, system-ui, sans-serif);
  font-size:var(--size);
  font-weight:var(--weight);
  line-height:1;
  color:var(--color);
  opacity:var(--opacity);
  transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale));
  text-shadow:0 0 18px #ffb38a35;
  will-change:transform,opacity;
  animation:
    qMarkCenterIn .72s cubic-bezier(.16,.82,.22,1) var(--delay) both,
    qMarkShake var(--speed) steps(2,end) calc(var(--delay) + .72s) infinite;
}
#questionChaos .qmark:nth-child(2n){
  animation-name:qMarkPeek,qMarkShake2;
}
#questionChaos .qmark:nth-child(3n){
  animation-name:qMarkPeek,qMarkShake3;
}
#questionChaos .qmark:nth-child(4n){
  animation-name:qMarkPeek,qMarkShake4;
}

@keyframes qMarkCenterIn{
  0%{
    left:50%; top:50%; opacity:0;
    transform:translate(-50%,-50%) rotate(calc(var(--rot) - 18deg)) scale(.10);
  }
  42%{
    opacity:var(--opacity);
    transform:translate(-50%,-50%) rotate(calc(var(--rot) + 7deg)) scale(.78);
  }
  72%{
    left:calc(var(--x) + (50% - var(--x))*0.18);
    top:calc(var(--y) + (50% - var(--y))*0.18);
    transform:translate(-50%,-50%) rotate(calc(var(--rot) - 3deg)) scale(1.06);
  }
  100%{
    left:var(--x); top:var(--y); opacity:var(--opacity);
    transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale));
  }
}

@keyframes qMarkShake{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  17%{transform:translate(calc(-50% + 4px),calc(-50% - 7px)) rotate(calc(var(--rot) + 7deg)) scale(1.04)}
  31%{transform:translate(calc(-50% - 6px),calc(-50% + 3px)) rotate(calc(var(--rot) - 9deg)) scale(.94)}
  52%{transform:translate(calc(-50% + 2px),calc(-50% + 8px)) rotate(calc(var(--rot) + 13deg)) scale(1.08)}
  73%{transform:translate(calc(-50% - 5px),calc(-50% - 3px)) rotate(calc(var(--rot) - 5deg)) scale(.97)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}
@keyframes qMarkShake2{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  23%{transform:translate(calc(-50% - 7px),calc(-50% + 4px)) rotate(calc(var(--rot) - 12deg)) scale(1.08)}
  47%{transform:translate(calc(-50% + 5px),calc(-50% - 5px)) rotate(calc(var(--rot) + 8deg)) scale(.92)}
  69%{transform:translate(calc(-50% - 2px),calc(-50% + 7px)) rotate(calc(var(--rot) - 16deg)) scale(1.05)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}
@keyframes qMarkShake3{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  19%{transform:translate(calc(-50% + 8px),calc(-50% + 2px)) rotate(calc(var(--rot) + 15deg)) scale(.9)}
  42%{transform:translate(calc(-50% - 4px),calc(-50% - 8px)) rotate(calc(var(--rot) - 6deg)) scale(1.12)}
  81%{transform:translate(calc(-50% + 6px),calc(-50% + 5px)) rotate(calc(var(--rot) + 10deg)) scale(.96)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}
@keyframes qMarkShake4{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  28%{transform:translate(calc(-50% - 5px),calc(-50% - 6px)) rotate(calc(var(--rot) + 18deg)) scale(1.1)}
  56%{transform:translate(calc(-50% + 7px),calc(-50% + 4px)) rotate(calc(var(--rot) - 13deg)) scale(.9)}
  82%{transform:translate(calc(-50% - 3px),calc(-50% + 6px)) rotate(calc(var(--rot) + 5deg)) scale(1.05)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}

.line.question-chaos .word.ligawan-chaos{
  font-family:"Poppins",sans-serif !important;
  font-size:inherit !important;
  font-weight:900 !important;
  letter-spacing:inherit !important;
  line-height:inherit !important;
  color:var(--accent);
  text-shadow:0 0 24px #ffb38a66;
}

.line.question-chaos.question-chorus-pulse{
  animation:questionChorusPulse .52s cubic-bezier(.16,.9,.2,1) both !important;
  z-index:7;
}
.line.question-chaos.question-chorus-pulse .word{
  text-shadow:0 0 34px #ffb38a66;
}
@keyframes questionChorusPulse{
  0%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
  24%{transform:translate3d(-3px,2px,0) scale(1.045) rotate(-.35deg);filter:drop-shadow(0 0 16px #ffb38a55)}
  52%{transform:translate3d(4px,-4px,0) scale(1.095) rotate(.45deg);filter:drop-shadow(0 0 30px #ffb38a88)}
  78%{transform:translate3d(-2px,2px,0) scale(1.035) rotate(-.25deg);filter:drop-shadow(0 0 15px #ffb38a44)}
  100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0);filter:none}
}
.line.question-chaos.question-chorus-fade{
  animation:questionChorusFade 1.00s cubic-bezier(.22,.72,.2,1) both !important;
}
.line.question-chaos.question-chorus-fade #questionChaos{
  animation:questionChorusFieldFade 1.00s cubic-bezier(.22,.72,.2,1) both !important;
}
@keyframes questionChorusFade{
  0%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
  42%{opacity:.92;transform:translate3d(0,-2px,0) scale(.995);filter:blur(.25px)}
  72%{opacity:.48;transform:translate3d(0,-7px,0) scale(.985);filter:blur(1.6px)}
  100%{opacity:0;transform:translate3d(0,-16px,0) scale(.97);filter:blur(4px)}
}
@keyframes questionChorusFieldFade{
  0%{opacity:1;transform:scale(1)}
  55%{opacity:.68;transform:scale(.99)}
  100%{opacity:0;transform:scale(.95)}
}

.line.question-next{
  animation:qNextIn .68s cubic-bezier(.16,.86,.2,1) both;
}
@keyframes qNextIn{
  0%{opacity:0;transform:translateY(34px) scale(.82) rotate(-1.5deg);filter:blur(10px)}
  52%{opacity:1;transform:translateY(-5px) scale(1.035) rotate(.4deg);filter:blur(0)}
  74%{transform:translateY(2px) scale(.985) rotate(-.2deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0);filter:blur(0)}
}

#wordExplosionField{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.clock-number-burst-layer{position:absolute;inset:-18%;z-index:3;overflow:visible;pointer-events:none}
.word-bg-burst{position:absolute;left:0;top:0;white-space:nowrap;font-family:inherit;font-weight:inherit;letter-spacing:inherit;line-height:inherit;color:#f8f0e6;opacity:0;transform:translate(-50%,-50%) scale(.18) rotate(var(--r));animation:wordBgBurst var(--life) cubic-bezier(.12,.8,.18,1) forwards;filter:blur(.35px);text-shadow:0 0 18px #ffb38a2e}
.clock-number-bg-burst{position:absolute;left:0;top:0;white-space:nowrap;font-family:"Poppins",sans-serif;font-weight:500;letter-spacing:-.02em;color:var(--accent);opacity:0;transform:translate(-50%,-50%) scale(.22) rotate(var(--r));animation:clockNumberBgBurst var(--life) cubic-bezier(.2,.8,.25,1) forwards;filter:blur(.15px);text-shadow:0 0 18px #ffb38a55;z-index:3;pointer-events:none}
@keyframes clockNumberBgBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(var(--r))}8%{opacity:var(--alpha);transform:translate(-50%,-50%) scale(.9) rotate(var(--r))}24%{opacity:calc(var(--alpha)*.72);transform:translate(calc(-50% + var(--dx)*.45),calc(-50% + var(--dy)*.45)) scale(1) rotate(var(--r2))}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--r2))}}
@keyframes wordBgBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.18) rotate(var(--r))}12%{opacity:var(--alpha)}45%{opacity:calc(var(--alpha)*.72)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--r2))}}

#ooExplosion{position:absolute;inset:0;z-index:8;overflow:hidden;pointer-events:none}
.oo-field{position:absolute;left:50%;top:50%;white-space:nowrap;font-weight:900;letter-spacing:-.08em;color:#f8f0e6;opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(var(--r));animation:ooTakeover var(--life) cubic-bezier(.12,.8,.18,1) forwards;text-shadow:0 0 24px #ffb38a33}
@keyframes ooTakeover{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(var(--r))}12%{opacity:.92}48%{opacity:.82}78%{opacity:.88}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--r2))}}
.oo-field.wipe{animation:ooWipe 1.15s cubic-bezier(.12,.75,.18,1) forwards}
@keyframes ooWipe{0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}18%{opacity:.95;transform:translate(-50%,-50%) scale(.8)}50%{opacity:.9;transform:translate(-50%,-50%) scale(2.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
.oo-heart{position:absolute;width:var(--size);height:var(--size);left:50%;top:50%;background:currentColor;opacity:0;rotate:-45deg;border-radius:2px;animation:ooHeartBurst var(--life) cubic-bezier(.12,.75,.18,1) forwards}
.oo-heart::before,.oo-heart::after{content:"";position:absolute;width:50%;height:50%;border-radius:50%;background:currentColor}.oo-heart::before{left:0;top:0}.oo-heart::after{right:0;top:0}
@keyframes ooHeartBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}10%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot))}}

.puso-throb .word{animation:lyricThrob .72s ease-in-out infinite}.puso-throb .word.current{animation:lyricThrobCurrent .48s ease-in-out infinite}
@keyframes lyricThrob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.025)}}
@keyframes lyricThrobCurrent{0%,100%{transform:translateY(-.055em) scale(1.06)}50%{transform:translateY(-.09em) scale(1.13)}}
.puso-bg-heart{position:absolute;left:var(--x);top:var(--y);font-size:var(--size);line-height:1;color:currentColor;opacity:0;transform:scale(.88);animation:pusoBgPulse var(--life) ease-in-out infinite;filter:drop-shadow(0 0 10px #ffb38a22);pointer-events:none}
@keyframes pusoBgPulse{
  0%{opacity:.025;transform:translate3d(0,8px,0) scale(.82) rotate(-5deg)}
  24%{opacity:.11;transform:translate3d(-12px,-8px,0) scale(1.02) rotate(4deg)}
  52%{opacity:.18;transform:translate3d(10px,3px,0) scale(1.16) rotate(-3deg)}
  76%{opacity:.09;transform:translate3d(-7px,-12px,0) scale(.96) rotate(6deg)}
  100%{opacity:.025;transform:translate3d(6px,8px,0) scale(.84) rotate(-4deg)}
}

#heartField{
  position:absolute;
  inset:0;
  z-index:6;
  overflow:hidden;
  pointer-events:none;
}
.puso-heart{
  position:absolute;
  left:0;
  top:0;
  width:auto;
  height:auto;
  color:#ffb38a;
  font-size:var(--size);
  line-height:1;
  opacity:0;
  text-shadow:0 0 14px #ffb38a66;
  transform:translate(-50%,-50%) scale(.25);
  animation:pusoHeartBurst var(--life) cubic-bezier(.18,.72,.25,1) forwards;
  will-change:transform,opacity;
}
@keyframes pusoHeartBurst{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.25) rotate(0deg);
  }
  12%{opacity:.95}
  72%{opacity:.72}
  100%{
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1)
      rotate(var(--rot));
  }
}

#greetingEchoField{position:absolute;inset:0;z-index:7;overflow:hidden;pointer-events:none}
.greeting-echo{position:absolute;left:var(--gx);top:var(--gy);white-space:nowrap;color:#fff;font-weight:700;line-height:1;letter-spacing:-.045em;opacity:0;mix-blend-mode:screen;filter:blur(var(--gb));transform:translate(-50%,-50%) scale(.72) rotate(var(--gr));animation:greetingEchoLife var(--gl) cubic-bezier(.16,.78,.25,1) forwards;will-change:transform,opacity}
@keyframes greetingEchoLife{0%{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(var(--gr));filter:blur(4px)}18%{opacity:var(--ga);filter:blur(var(--gb))}55%{opacity:calc(var(--ga) * .82);transform:translate(-50%,-50%) scale(1.02) rotate(var(--gr));filter:blur(var(--gb))}100%{opacity:0;transform:translate(-50%,-50%) scale(1.16) rotate(var(--gr));filter:blur(1.5px)}}
#missYouEchoField{position:absolute;inset:0;z-index:4;overflow:hidden;pointer-events:none;}
#missYouStarField{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;}
.miss-you-star{
  position:absolute;left:50%;top:50%;
  width:var(--ss);height:var(--ss);
  opacity:0;
  background:#fff;border-radius:1px;
  transform:translate(-50%,-50%) scale(.1) rotate(45deg);
  box-shadow:0 0 5px #fff,0 0 12px #ffb38a66;
  will-change:transform,opacity;
  animation:missYouStarForm var(--life) cubic-bezier(.18,.82,.2,1) var(--delay) forwards,
            missYouStarTwinkle var(--twinkle) ease-in-out var(--twinkle-delay) infinite alternate;
}
.miss-you-star::before,.miss-you-star::after{
  content:"";position:absolute;left:50%;top:50%;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  transform:translate(-50%,-50%);opacity:.8;
}
.miss-you-star::before{width:320%;height:1px;}
.miss-you-star::after{width:1px;height:320%;}
@keyframes missYouStarForm{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.08) rotate(45deg);filter:blur(3px)}
  12%{opacity:.9}
  42%{opacity:.78;transform:translate(calc(-50% + var(--x1)),calc(-50% + var(--y1))) scale(.7) rotate(45deg);filter:blur(.2px)}
  72%{opacity:.72;transform:translate(calc(-50% + var(--x2)),calc(-50% + var(--y2))) scale(1) rotate(45deg);filter:blur(0)}
  100%{opacity:.48;transform:translate(calc(-50% + var(--x2)),calc(-50% + var(--y2))) scale(1) rotate(45deg);filter:blur(0)}
}
@keyframes missYouStarTwinkle{
  0%{opacity:.30;transform:translate(calc(-50% + var(--x2)),calc(-50% + var(--y2))) scale(.82) rotate(45deg)}
  100%{opacity:.68;transform:translate(calc(-50% + var(--x2)),calc(-50% + var(--y2))) scale(1.12) rotate(45deg)}
}

.miss-you-echo{position:absolute;left:var(--mxp);top:var(--myp);white-space:nowrap;color:#fff;font-family:"Poppins",sans-serif;font-weight:600;letter-spacing:-.045em;line-height:1;opacity:0;mix-blend-mode:screen;text-shadow:0 0 18px #fff4;filter:blur(var(--mblur));transform:translate(-50%,-50%) scale(.72) rotate(var(--mrot));animation:missYouEchoMotion var(--mlife) cubic-bezier(.16,.78,.25,1) forwards;will-change:transform,opacity;}

.line.first-linyahan-vertical{

.linyahan-dash-field{
  position:absolute;
  inset:-20vh -20vw;
  z-index:12;
  pointer-events:none;
  overflow:visible;
  opacity:0;
}
.first-linyahan-vertical.linyahan-hit .linyahan-dash-field{
  opacity:1;
}
.linyahan-dash{
  position:absolute;
  left:50%;
  top:50%;
  width:145vw;
  height:0;
  border-top:2px dashed #ffb38a;
  filter:drop-shadow(0 0 5px #ffb38a99);
  opacity:0;
  transform-origin:center;
  will-change:transform,opacity;
}
.first-linyahan-vertical.linyahan-hit .linyahan-dash{
  animation:linyahanDashSweep var(--dash-life) cubic-bezier(.18,.75,.18,1) var(--dash-delay) both;
}
.linyahan-dash::after{
  content:"";
  position:absolute;
  left:0;
  top:-3px;
  width:34%;
  height:5px;
  background:linear-gradient(90deg,transparent,#fff2e8,#ffb38a,transparent);
  filter:blur(1px);
  opacity:.8;
  transform:translateX(-100%);
}
.first-linyahan-vertical.linyahan-hit .linyahan-dash::after{
  animation:dashTrail var(--dash-life) cubic-bezier(.18,.75,.18,1) var(--dash-delay) both;
}
@keyframes linyahanDashSweep{
  0%{
    opacity:0;
    transform:translate3d(var(--dash-x),var(--dash-y),0) rotate(var(--dash-r)) scaleX(.72);
  }
  16%{opacity:.95}
  42%{
    opacity:.9;
    transform:translate3d(0,0,0) rotate(var(--dash-r)) scaleX(1);
  }
  70%{
    opacity:.58;
    transform:translate3d(calc(var(--dash-x)*-.34),calc(var(--dash-y)*-.34),0) rotate(var(--dash-r)) scaleX(1.08);
  }
  100%{
    opacity:0;
    transform:translate3d(calc(var(--dash-x)*-.9),calc(var(--dash-y)*-.9),0) rotate(var(--dash-r)) scaleX(1.22);
  }
}
@keyframes dashTrail{
  0%{opacity:0;transform:translateX(-100%)}
  18%{opacity:.9}
  55%{opacity:.62;transform:translateX(95%)}
  100%{opacity:0;transform:translateX(330%)}
}

.line.first-linyahan-vertical.out{
  animation:linyahanStackExit .58s cubic-bezier(.18,.8,.2,1) forwards!important;
}
@keyframes linyahanStackExit{
  0%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  45%{opacity:1;transform:translateY(-4px) scale(1.015);filter:blur(0)}
  100%{opacity:0;transform:translateY(-48px) scale(.91);filter:blur(7px)}
}
.first-linyahan-vertical.out .linyahan-dash-field{

}
@keyframes dashFieldExit{
  0%{opacity:.55;transform:scale(1)}
  100%{opacity:0;transform:scale(1.08)}
}

.first-linyahan-stroke{
  position:absolute;
  z-index:1;
  pointer-events:none;
  opacity:0;
  will-change:transform,opacity;
  border:0;
  background:repeating-linear-gradient(90deg,#ffb38a 0 12px,transparent 12px 23px);
  box-shadow:0 0 9px #ffb38a55;
}
.first-linyahan-vertical.active .first-linyahan-stroke{
  animation-timing-function:cubic-bezier(.18,.8,.18,1);
  animation-fill-mode:forwards;
}

.first-linyahan-stroke-h{
  left:-125vw; width:150vw; height:var(--thick,2px);
  top:var(--y,50%);
  background:repeating-linear-gradient(90deg,#ffb38a 0 var(--dash,12px),transparent var(--dash,12px) calc(var(--dash,12px) + var(--gap,11px)));
  animation-name:firstLinyahanTravelH;
  animation-duration:var(--dur,3.2s);
  animation-delay:var(--delay,0s);
  animation-timing-function:linear!important;
}
.first-linyahan-stroke-h.reverse{
  left:auto; right:-125vw;
  animation-name:firstLinyahanTravelHReverse;
}
.first-linyahan-stroke-v{
  top:-125vh; left:var(--x,50%); width:var(--thick,2px); height:150vh;
  background:repeating-linear-gradient(0deg,#ffb38a 0 var(--dash,12px),transparent var(--dash,12px) calc(var(--dash,12px) + var(--gap,11px)));
  animation-name:firstLinyahanTravelV;
  animation-duration:var(--dur,3.2s);
  animation-delay:var(--delay,0s);
  animation-timing-function:linear!important;
}
.first-linyahan-stroke-v.reverse{
  top:auto; bottom:-125vh;
  animation-name:firstLinyahanTravelVReverse;
}
.first-linyahan-stroke-d{
  width:155vw; height:var(--thick,2px);
  left:-130vw; top:var(--y,50%);
  transform:rotate(var(--angle,25deg));
  transform-origin:center center;
  background:repeating-linear-gradient(90deg,#ffb38a 0 var(--dash,11px),transparent var(--dash,11px) calc(var(--dash,11px) + var(--gap,14px)));
  animation-name:firstLinyahanTravelD;
  animation-duration:var(--dur,3.4s);
  animation-delay:var(--delay,0s);
  animation-timing-function:linear!important;
}
.first-linyahan-stroke-d.reverse{
  left:auto; right:-130vw;
  animation-name:firstLinyahanTravelDReverse;
}
@keyframes firstLinyahanTravelH{
  0%{opacity:0;transform:translateX(-18vw)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(150vw)}
  100%{opacity:0;transform:translateX(175vw)}
}
@keyframes firstLinyahanTravelHReverse{
  0%{opacity:0;transform:translateX(18vw)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(-150vw)}
  100%{opacity:0;transform:translateX(-175vw)}
}
@keyframes firstLinyahanTravelV{
  0%{opacity:0;transform:translateY(-18vh)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateY(150vh)}
  100%{opacity:0;transform:translateY(175vh)}
}
@keyframes firstLinyahanTravelVReverse{
  0%{opacity:0;transform:translateY(18vh)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateY(-150vh)}
  100%{opacity:0;transform:translateY(-175vh)}
}
@keyframes firstLinyahanTravelD{
  0%{opacity:0;transform:translateX(-145vw) rotate(var(--angle,25deg))}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(145vw) rotate(var(--angle,25deg))}
  100%{opacity:0;transform:translateX(175vw) rotate(var(--angle,25deg))}
}
@keyframes firstLinyahanTravelDReverse{
  0%{opacity:0;transform:translateX(145vw) rotate(var(--angle,-25deg))}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(-145vw) rotate(var(--angle,-25deg))}
  100%{opacity:0;transform:translateX(-175vw) rotate(var(--angle,-25deg))}
}
.line.first-linyahan-vertical.out{animation:none!important;}
.line.first-linyahan-vertical.out .first-linyahan-stroke{animation:firstLinyahanStrokeOut .28s ease-in forwards!important;}
@keyframes firstLinyahanStrokeOut{from{opacity:inherit}to{opacity:0}}
