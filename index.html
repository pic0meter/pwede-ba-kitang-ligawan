<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pwede Ba Kitang Ligawan — Kinetic Lyrics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');
:root{--bg:#0d0b0a;--ink:#f8f0e6;--muted:#b6a99c;--accent:#ffb38a;--line:#ffffff20;--x:50%;--y:50%;}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Manrope,system-ui,sans-serif}button{font:inherit;color:inherit}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at var(--x) var(--y),#33241d 0,#171210 30%,#0d0b0a 70%);isolation:isolate}
#grain{position:absolute;inset:-50%;opacity:.065;pointer-events:none;z-index:20;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");animation:grain .18s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
.ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.18;transition:transform .3s ease}.o1{width:38vw;height:38vw;background:#a75d3d;left:-12vw;top:10vh}.o2{width:28vw;height:28vw;background:#70583c;right:-8vw;bottom:-6vh}
#top{position:absolute;left:4vw;right:4vw;top:3.5vh;display:flex;justify-content:space-between;align-items:center;z-index:10;font:500 10px 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#cfc1b4}.title{display:flex;gap:10px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #ffb38a99}.counter{opacity:.75}
#stage{position:absolute;inset:0;display:grid;place-items:center;padding:10vh 7vw 17vh;z-index:4}.lyric{position:relative;width:min(1100px,88vw);text-align:center;min-height:190px;display:flex;align-items:center;justify-content:center}.line{position:absolute;max-width:100%;opacity:0;transform:translateY(25px) scale(.96);filter:blur(7px);transition:opacity .35s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .45s ease;will-change:transform,opacity,filter}.line.active{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}.line.out{opacity:0;transform:translateY(-45px) scale(1.05);filter:blur(5px)}
.word{display:inline-block;margin:.03em .12em;transform:translateY(0);transition:transform .18s ease,font-size .18s ease;will-change:transform}.beat .word:nth-child(odd){transform:translateY(-.025em)}
.line.verse{font-size:clamp(28px,4.4vw,68px);font-weight:600;letter-spacing:-.045em;line-height:1.05}.line.soft{font-size:clamp(25px,3.7vw,58px);font-weight:400;letter-spacing:-.04em;line-height:1.08}.line.chorus{font-size:clamp(45px,8.7vw,132px);font-weight:800;letter-spacing:-.075em;line-height:.88;text-transform:none}.line.big{font-size:clamp(56px,11vw,170px);font-weight:800;letter-spacing:-.085em;line-height:.8}.line.small{font:500 clamp(17px,2vw,29px) 'DM Mono',monospace;letter-spacing:.04em;line-height:1.25}.accent{color:var(--accent)}
#echoes{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.echo{position:absolute;font-weight:800;white-space:nowrap;color:#fff;opacity:0;mix-blend-mode:screen;letter-spacing:-.08em}.echo.show{animation:echo 1.25s cubic-bezier(.2,.7,.2,1) forwards}@keyframes echo{0%{opacity:0;transform:translate(0,0) scale(.65) rotate(var(--r))}20%{opacity:.08}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r))}}
#hint{position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);z-index:11;text-align:center;color:#c8bdb3;font:500 10px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;transition:opacity .5s}.playing #hint{opacity:0}.play{border:1px solid #ffffff35;background:#ffffff08;backdrop-filter:blur(10px);border-radius:999px;padding:12px 20px;cursor:pointer;transition:.2s}.play:hover{background:#ffffff14;transform:translateY(-1px)}
#controls{position:absolute;left:4vw;right:4vw;bottom:4.5vh;z-index:12;display:flex;align-items:center;gap:15px}.ctrl{width:42px;height:42px;border:1px solid #ffffff2d;background:#ffffff09;border-radius:50%;cursor:pointer}.track{height:2px;background:#ffffff20;flex:1;position:relative}.progress{position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent);box-shadow:0 0 14px #ffb38a77}.time{font:500 10px 'DM Mono',monospace;color:#bcaea1;min-width:88px;text-align:right}
#section{position:absolute;right:4vw;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;color:#8f8379;font:500 9px 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;z-index:10}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:9;pointer-events:none}.flash.hit{animation:flash .16s ease-out}@keyframes flash{0%{opacity:.12}100%{opacity:0}}
@media(max-width:600px){#top{top:3vh}.line.verse{font-size:clamp(27px,8.5vw,42px)}.line.soft{font-size:clamp(24px,7.4vw,38px)}.line.chorus{font-size:clamp(46px,15vw,82px)}.line.big{font-size:clamp(55px,18vw,100px)}#stage{padding:12vh 8vw 20vh}.lyric{min-height:250px}.time{min-width:72px}.track{margin-left:4px}.o1{width:70vw;height:70vw}}
</style></head>
<body>
<div id="app"><div class="ambient"><div class="orb o1"></div><div class="orb o2"></div></div><div id="grain"></div><div id="echoes"></div><div id="top"><div class="title"><span class="dot"></span><span>PWede ba kitang ligawan</span></div><div class="counter" id="counter">00:00 / 02:36</div></div><div id="section">intro</div><div id="stage"><div class="lyric" id="lyric"></div></div><div id="hint"><button class="play" id="start">Tap to begin</button></div><div class="flash" id="flash"></div><div id="controls"><button class="ctrl" id="toggle" aria-label="Play/Pause">▶</button><div class="track"><div class="progress" id="progress"></div></div><div class="time" id="time">00:00</div></div><audio id="audio" preload="auto" src="song.mp3"></audio></div>
<script>
const A=document.querySelector('#audio'), L=document.querySelector('#lyric'), P=document.querySelector('#progress'), T=document.querySelector('#time'), C=document.querySelector('#counter'), H=document.querySelector('#hint'), APP=document.querySelector('#app'), TOGGLE=document.querySelector('#toggle'), FLASH=document.querySelector('#flash'), SEC=document.querySelector('#section'), E=document.querySelector('#echoes');
const lines=[
[0.8,6.8,'Pwede ba akong tumambay dyan sa <span class="accent">puso mo</span>','verse','verse'],
[7.0,13.9,"Parang masyado na yatang gasgas ang banat na 'to",'soft','verse'],
[14.1,21.9,'Kailan kaya ako makakaisip ng linyang para sa <span class="accent">\'yo</span>','verse','verse'],
[22.1,30.0,"Gusto ko lang naman ay makamit ang matamis mong 'oo'",'soft','verse'],
[31.0,37.0,'Pwede ba kitang <span class="accent">ligawan</span>','chorus','chorus'],
[37.1,44.2,"Kahit 'di maganda ang mga linyahan",'soft','chorus'],
[44.3,51.4,'Bibigay ko nang buo ang <span class="accent">oras ko</span>','soft','chorus'],
[51.5,58.5,"Kasi do'n alam kong magaling ako",'verse','chorus'],
[59.0,65.0,'Pwede ba kitang <span class="accent">ligawan</span>','chorus','chorus'],
[65.1,68.4,'Oo o <span class="accent">hindi</span>','big','chorus'],
[70.0,76.5,'Ikaw ay lagi kong pupuntahan','verse','verse2'],
[76.6,82.4,'Kahit malayo pa <span class="accent">\'yan</span>','soft','verse2'],
[82.5,90.0,"Pati ang nanay mo'y aking dadalhan",'verse','verse2'],
[90.1,98.2,"Ng paborito niyang ulam <span class='accent'>(paborito niyang ulam)</span>",'soft','verse2'],
[98.4,104.8,'At kahit pahirapan pa','verse','verse2'],
[104.9,111.2,'Ako ng tatay mo hindi <span class="accent">aatras</span>','soft','verse2'],
[111.4,117.4,'Kasi gusto kita','chorus','verse2'],
[117.5,126.0,'Gustong-gusto, gustong-gusto <span class="accent">kita</span>','big','verse2'],
[127.0,133.0,'Pwede ba kitang <span class="accent">ligawan</span>','chorus','final'],
[133.1,140.2,"Kahit 'di maganda ang mga linyahan",'soft','final'],
[140.3,147.0,'Bibigay ko nang buo ang <span class="accent">oras ko</span>','soft','final'],
[147.1,152.8,'Kasi do\'n alam kong magaling ako','verse','final'],
[153.0,155.2,'Pwede ba kitang <span class="accent">ligawan</span>','chorus','final'],
[155.2,156.3,'Oo o <span class="accent">hindi</span>','big','final']
];
let current=-1,lastBeat=-1,ctx,analyser,data,playing=false;
const beatPeriod=60/123.046875;
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
function setWords(el){el.innerHTML=el.innerHTML.replace(/([^<>\s]+(?:\s+[^<>\s]+)*)/g,m=>m).split(/(\s+)/).map(x=>x.trim()?`<span class="word">${x}</span>`:x).join('')}
function activate(i){if(i===current)return; if(current>=0){const old=L.querySelector('.line.active');if(old){old.classList.remove('active');old.classList.add('out')}} current=i;if(i<0){L.innerHTML='';return} L.innerHTML=`<div class="line ${lines[i][3]}">${lines[i][2]}</div>`;const el=L.firstElementChild;setWords(el);requestAnimationFrame(()=>el.classList.add('active')); SEC.textContent=lines[i][4];}
function pulse(t){const idx=Math.floor((t-0.197)/beatPeriod); if(idx>lastBeat && idx>=0){lastBeat=idx; APP.classList.add('beat');FLASH.classList.add('hit');setTimeout(()=>APP.classList.remove('beat'),100);setTimeout(()=>FLASH.classList.remove('hit'),160); if(idx%4===0) echo();}}
function echo(){const e=document.createElement('div');e.className='echo show';e.textContent=['LIGAWAN','OO O HINDI','GUSTO KITA','PUSO MO'][Math.floor(Math.random()*4)];e.style.left=(10+Math.random()*70)+'%';e.style.top=(20+Math.random()*60)+'%';e.style.fontSize=(20+Math.random()*80)+'px';e.style.setProperty('--dx',(Math.random()*180-90)+'px');e.style.setProperty('--dy',(Math.random()*180-90)+'px');e.style.setProperty('--r',(Math.random()*18-9)+'deg');E.appendChild(e);setTimeout(()=>e.remove(),1300)}
function loop(){const t=A.currentTime; const i=lines.findIndex(x=>t>=x[0]&&t<x[1]);activate(i);pulse(t);P.style.width=(t/A.duration*100||0)+'%';T.textContent=fmt(t);C.textContent=fmt(t)+' / '+fmt(A.duration||156.43); if(analyser){analyser.getByteFrequencyData(data);let avg=0;for(let i=0;i<data.length;i++)avg+=data[i];avg/=data.length;const scale=1+avg/255*.025;document.documentElement.style.setProperty('--x',(50+Math.sin(t*.7)*12)+'%');document.documentElement.style.setProperty('--y',(50+Math.cos(t*.53)*10)+'%');document.querySelector('.orb.o1').style.transform=`scale(${scale})`;document.querySelector('.orb.o2').style.transform=`scale(${1+(255-avg)/255*.06})`} requestAnimationFrame(loop)}
async function play(){try{await A.play();playing=true;APP.classList.add('playing');TOGGLE.textContent='❚❚';if(!ctx){ctx=new AudioContext();const src=ctx.createMediaElementSource(A);analyser=ctx.createAnalyser();analyser.fftSize=128;data=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);analyser.connect(ctx.destination)}}}catch(e){console.error(e)}}
function pause(){A.pause();playing=false;TOGGLE.textContent='▶'}
document.querySelector('#start').onclick=play;TOGGLE.onclick=()=>playing?pause():play();A.addEventListener('ended',()=>{playing=false;TOGGLE.textContent='▶';activate(-1)});A.addEventListener('loadedmetadata',()=>C.textContent='00:00 / '+fmt(A.duration));A.addEventListener('timeupdate',()=>{});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight')A.currentTime=Math.min(A.duration,A.currentTime+5);if(e.code==='ArrowLeft')A.currentTime=Math.max(0,A.currentTime-5)});document.querySelector('.track').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();A.currentTime=(e.clientX-r.left)/r.width*A.duration};
loop();
</script></body></html>
