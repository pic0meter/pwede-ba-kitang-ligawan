<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b0a">
<title>Pwede Ba Kitang Ligawan — Kinetic Lyrics</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Coiny&family=Lilita+One&family=Poppins:wght@400;500;600;700;800;900&display=swap");
:root{
  --bg:#0d0b0a;--ink:#f8f0e6;--muted:#b6a99c;--accent:#ffb38a;
  --x:50%;--y:50%;--mx:0px;--my:0px;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);
  overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#app{
  position:relative;width:100vw;height:100dvh;overflow:hidden;
  background:
    radial-gradient(circle at var(--x) var(--y),#33241d 0,#171210 30%,#0d0b0a 70%);
  isolation:isolate;
}
#grain{
  position:absolute;inset:-50%;opacity:.055;pointer-events:none;z-index:30;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation:grain .18s steps(2) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}
  50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}
.ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{
  position:absolute;border-radius:50%;filter:blur(70px);opacity:.18;
  transition:transform .15s ease;will-change:transform;
}
.o1{width:38vw;height:38vw;background:#a75d3d;left:-12vw;top:10vh}
.o2{width:28vw;height:28vw;background:#70583c;right:-8vw;bottom:-6vh}

#top{
  position:absolute;left:4vw;right:4vw;top:3.5vh;display:flex;
  justify-content:space-between;align-items:center;z-index:10;
  font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#cfc1b4;
}
.title{display:flex;gap:10px;align-items:center}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 18px #ffb38a99;transition:transform .25s ease;
}
.playing .dot{transform:scale(1.45)}
.counter{opacity:.75}

#stage{
  position:absolute;inset:0;display:grid;place-items:center;
  padding:10vh 7vw 17vh;z-index:4;
}
.lyric{
  position:relative;width:min(1100px,90vw);height:min(48vh,430px);
  display:flex;align-items:center;justify-content:center;
}
.line{
  position:absolute;max-width:100%;text-align:center;
  opacity:0;transform:translateY(25px) scale(.965);
  filter:blur(8px);pointer-events:none;
  transition:
    opacity .32s ease,
    transform .65s cubic-bezier(.2,.8,.2,1),
    filter .45s ease;
  will-change:transform,opacity,filter;
}
.line.active{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
.line.out{
  opacity:0;transform:translateY(-35px) scale(1.035);filter:blur(6px);
}

/* FIRST-HALF LINE-TO-LINE TRANSITIONS
   Keep the old lyric on screen while the next one enters. The movement is
   deliberately restrained so each scene change feels connected rather than
   like one lyric is being thrown away and another is being dropped in. */
.line.first-half-transition{
  transition:
    opacity .42s cubic-bezier(.22,.7,.25,1),
    transform .58s cubic-bezier(.22,.8,.22,1),
    filter .42s ease;
}
.line.first-half-transition.out{
  opacity:0;
  transform:translateY(-12px) scale(.985);
  filter:blur(3px);
}
.line.first-half-transition.active{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:blur(0);
}
.line.verse{
  font-size:clamp(28px,4.4vw,68px);font-weight:600;
  letter-spacing:-.045em;line-height:1.05;
}
.line.soft{
  font-size:clamp(25px,3.7vw,58px);font-weight:400;
  letter-spacing:-.04em;line-height:1.08;
}
.line.chorus{
  font-size:clamp(45px,8.7vw,132px);font-weight:800;
  letter-spacing:-.075em;line-height:.88;
}
.line.big{
  font-size:clamp(56px,11vw,170px);font-weight:800;
  letter-spacing:-.085em;line-height:.8;
}
.word{
  display:inline-block;margin:.03em .105em;
  opacity:.08;transform:translateY(.38em) scale(.94);
  filter:blur(5px);color:#d9cec4;
  transition:
    opacity .16s ease,
    transform .22s cubic-bezier(.2,.8,.2,1),
    filter .2s ease,color .2s ease,text-shadow .2s ease;
  will-change:transform,opacity,filter;
}
.word.visible{
  opacity:1;transform:translateY(0) scale(1);filter:blur(0);color:var(--ink);
}
.word.current{
  color:var(--accent);transform:translateY(-.055em) scale(1.06);
  text-shadow:0 0 28px #ffb38a55;
}
.word.accent,.word.visible.accent{color:var(--accent)}

/* Energetic first-chorus bob: the whole question line stays alive while the
   background marks settle into their final positions. */
.line.question-chaos.active{
  animation:firstChorusBob 1.02s cubic-bezier(.36,.07,.19,.97) infinite alternate !important;
}
@keyframes firstChorusBob{
  0%{transform:translate3d(-6px,4px,0) rotate(-.45deg) scale(1)}
  17%{transform:translate3d(5px,-7px,0) rotate(.65deg) scale(1.012)}
  36%{transform:translate3d(-4px,8px,0) rotate(-.8deg) scale(.994)}
  55%{transform:translate3d(7px,-4px,0) rotate(.55deg) scale(1.018)}
  74%{transform:translate3d(-5px,6px,0) rotate(-.65deg) scale(1.005)}
  100%{transform:translate3d(4px,-5px,0) rotate(.4deg) scale(1.012)}
}

/* FIRST-CHORUS QUESTION-MARK CHAOS
   Appears when "ligawan?" arrives, lives only until the next lyric,
   then collapses/wipes away as the next line enters. */
#questionChaos{
  position:absolute;
  inset:0;
  z-index:6;
  pointer-events:none;
  overflow:visible;
  opacity:0;
}
#questionChaos.ready{opacity:1}
#questionChaos .qmark{
  position:absolute;
  /* x positions beyond 100% / below 0% are intentionally clipped by the viewport */
  left:var(--x);
  top:var(--y);
  font-family:var(--font, Inter, system-ui, sans-serif);
  font-size:var(--size);
  font-weight:var(--weight);
  line-height:1;
  color:var(--color);
  opacity:var(--opacity);
  transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale));
  text-shadow:0 0 18px #ffb38a35;
  will-change:transform,opacity;
  /* The mark first glides in from beyond the edge, then hands off to the
     existing erratic shake. Both animations use the same transform, so the
     entrance feels like a peek rather than a pop. */
  animation:
    qMarkCenterIn .72s cubic-bezier(.16,.82,.22,1) var(--delay) both,
    qMarkShake var(--speed) steps(2,end) calc(var(--delay) + .72s) infinite;
}
#questionChaos .qmark:nth-child(2n){
  animation-name:qMarkPeek,qMarkShake2;
}
#questionChaos .qmark:nth-child(3n){
  animation-name:qMarkPeek,qMarkShake3;
}
#questionChaos .qmark:nth-child(4n){
  animation-name:qMarkPeek,qMarkShake4;
}

@keyframes qMarkCenterIn{
  0%{
    left:50%; top:50%; opacity:0;
    transform:translate(-50%,-50%) rotate(calc(var(--rot) - 18deg)) scale(.10);
  }
  42%{
    opacity:var(--opacity);
    transform:translate(-50%,-50%) rotate(calc(var(--rot) + 7deg)) scale(.78);
  }
  72%{
    left:calc(var(--x) + (50% - var(--x))*0.18);
    top:calc(var(--y) + (50% - var(--y))*0.18);
    transform:translate(-50%,-50%) rotate(calc(var(--rot) - 3deg)) scale(1.06);
  }
  100%{
    left:var(--x); top:var(--y); opacity:var(--opacity);
    transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale));
  }
}

@keyframes qMarkShake{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  17%{transform:translate(calc(-50% + 4px),calc(-50% - 7px)) rotate(calc(var(--rot) + 7deg)) scale(1.04)}
  31%{transform:translate(calc(-50% - 6px),calc(-50% + 3px)) rotate(calc(var(--rot) - 9deg)) scale(.94)}
  52%{transform:translate(calc(-50% + 2px),calc(-50% + 8px)) rotate(calc(var(--rot) + 13deg)) scale(1.08)}
  73%{transform:translate(calc(-50% - 5px),calc(-50% - 3px)) rotate(calc(var(--rot) - 5deg)) scale(.97)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}
@keyframes qMarkShake2{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  23%{transform:translate(calc(-50% - 7px),calc(-50% + 4px)) rotate(calc(var(--rot) - 12deg)) scale(1.08)}
  47%{transform:translate(calc(-50% + 5px),calc(-50% - 5px)) rotate(calc(var(--rot) + 8deg)) scale(.92)}
  69%{transform:translate(calc(-50% - 2px),calc(-50% + 7px)) rotate(calc(var(--rot) - 16deg)) scale(1.05)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}
@keyframes qMarkShake3{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  19%{transform:translate(calc(-50% + 8px),calc(-50% + 2px)) rotate(calc(var(--rot) + 15deg)) scale(.9)}
  42%{transform:translate(calc(-50% - 4px),calc(-50% - 8px)) rotate(calc(var(--rot) - 6deg)) scale(1.12)}
  81%{transform:translate(calc(-50% + 6px),calc(-50% + 5px)) rotate(calc(var(--rot) + 10deg)) scale(.96)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}
@keyframes qMarkShake4{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
  28%{transform:translate(calc(-50% - 5px),calc(-50% - 6px)) rotate(calc(var(--rot) + 18deg)) scale(1.1)}
  56%{transform:translate(calc(-50% + 7px),calc(-50% + 4px)) rotate(calc(var(--rot) - 13deg)) scale(.9)}
  82%{transform:translate(calc(-50% - 3px),calc(-50% + 6px)) rotate(calc(var(--rot) + 5deg)) scale(1.05)}
  100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
}

/* "ligawan?" itself gets the same nervous, unpredictable energy. */
.line.question-chaos .word.ligawan-chaos{
  /* Keep "ligawan?" typographically identical to the other lyric words.
     Its personality comes from motion/color, not a different typeface or scale. */
  font-family:inherit !important;
  font-size:inherit !important;
  font-weight:inherit !important;
  letter-spacing:inherit !important;
  line-height:inherit !important;
  color:var(--accent);
  text-shadow:0 0 24px #ffb38a66;
}


/* First-chorus transition beat: a musical pulse at 00:44, followed by a
   long soft fade so the next lyric can enter without a hard cut. */
.line.question-chaos.question-chorus-pulse{
  animation:questionChorusPulse .52s cubic-bezier(.16,.9,.2,1) both !important;
  z-index:7;
}
.line.question-chaos.question-chorus-pulse .word{
  text-shadow:0 0 34px #ffb38a66;
}
@keyframes questionChorusPulse{
  0%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
  24%{transform:translate3d(-3px,2px,0) scale(1.045) rotate(-.35deg);filter:drop-shadow(0 0 16px #ffb38a55)}
  52%{transform:translate3d(4px,-4px,0) scale(1.095) rotate(.45deg);filter:drop-shadow(0 0 30px #ffb38a88)}
  78%{transform:translate3d(-2px,2px,0) scale(1.035) rotate(-.25deg);filter:drop-shadow(0 0 15px #ffb38a44)}
  100%{transform:translate3d(0,0,0) scale(1) rotate(0);filter:none}
}
.line.question-chaos.question-chorus-fade{
  animation:questionChorusFade 1.00s cubic-bezier(.22,.72,.2,1) both !important;
}
.line.question-chaos.question-chorus-fade #questionChaos{
  animation:questionChorusFieldFade 1.00s cubic-bezier(.22,.72,.2,1) both !important;
}
@keyframes questionChorusFade{
  0%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
  42%{opacity:.92;transform:translate3d(0,-2px,0) scale(.995);filter:blur(.25px)}
  72%{opacity:.48;transform:translate3d(0,-7px,0) scale(.985);filter:blur(1.6px)}
  100%{opacity:0;transform:translate3d(0,-16px,0) scale(.97);filter:blur(4px)}
}
@keyframes questionChorusFieldFade{
  0%{opacity:1;transform:scale(1)}
  55%{opacity:.68;transform:scale(.99)}
  100%{opacity:0;transform:scale(.95)}
}

/* Next lyric arrives through the space left by the question marks. */
.line.question-next{
  animation:qNextIn .68s cubic-bezier(.16,.86,.2,1) both;
}
@keyframes qNextIn{
  0%{opacity:0;transform:translateY(34px) scale(.82) rotate(-1.5deg);filter:blur(10px)}
  52%{opacity:1;transform:translateY(-5px) scale(1.035) rotate(.4deg);filter:blur(0)}
  74%{transform:translateY(2px) scale(.985) rotate(-.2deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0);filter:blur(0)}
}

@media(max-width:600px){
  #questionChaos .qmark{
    text-shadow:0 0 13px #ffb38a44;
  }
}



#wordExplosionField{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.clock-number-burst-layer{position:absolute;inset:-18%;z-index:3;overflow:visible;pointer-events:none}
.word-bg-burst{position:absolute;left:0;top:0;white-space:nowrap;font-family:inherit;font-weight:inherit;letter-spacing:inherit;line-height:inherit;color:#f8f0e6;opacity:0;transform:translate(-50%,-50%) scale(.18) rotate(var(--r));animation:wordBgBurst var(--life) cubic-bezier(.12,.8,.18,1) forwards;filter:blur(.35px);text-shadow:0 0 18px #ffb38a2e}
.clock-number-bg-burst{position:absolute;left:0;top:0;white-space:nowrap;font-family:"Poppins",sans-serif;font-weight:500;letter-spacing:-.02em;color:var(--accent);opacity:0;transform:translate(-50%,-50%) scale(.22) rotate(var(--r));animation:clockNumberBgBurst var(--life) cubic-bezier(.2,.8,.25,1) forwards;filter:blur(.15px);text-shadow:0 0 18px #ffb38a55;z-index:3;pointer-events:none}
@keyframes clockNumberBgBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(var(--r))}8%{opacity:var(--alpha);transform:translate(-50%,-50%) scale(.9) rotate(var(--r))}24%{opacity:calc(var(--alpha)*.72);transform:translate(calc(-50% + var(--dx)*.45),calc(-50% + var(--dy)*.45)) scale(1) rotate(var(--r2))}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--r2))}}
@keyframes wordBgBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.18) rotate(var(--r))}12%{opacity:var(--alpha)}45%{opacity:calc(var(--alpha)*.72)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--r2))}}

#ooExplosion{position:absolute;inset:0;z-index:8;overflow:hidden;pointer-events:none}
.oo-field{position:absolute;left:50%;top:50%;white-space:nowrap;font-weight:900;letter-spacing:-.08em;color:#f8f0e6;opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(var(--r));animation:ooTakeover var(--life) cubic-bezier(.12,.8,.18,1) forwards;text-shadow:0 0 24px #ffb38a33}
@keyframes ooTakeover{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(var(--r))}12%{opacity:.92}48%{opacity:.82}78%{opacity:.88}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--r2))}}
.oo-field.wipe{animation:ooWipe 1.15s cubic-bezier(.12,.75,.18,1) forwards}
@keyframes ooWipe{0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}18%{opacity:.95;transform:translate(-50%,-50%) scale(.8)}50%{opacity:.9;transform:translate(-50%,-50%) scale(2.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
.oo-heart{position:absolute;width:var(--size);height:var(--size);left:50%;top:50%;background:currentColor;opacity:0;rotate:-45deg;border-radius:2px;animation:ooHeartBurst var(--life) cubic-bezier(.12,.75,.18,1) forwards}
.oo-heart::before,.oo-heart::after{content:"";position:absolute;width:50%;height:50%;border-radius:50%;background:currentColor}.oo-heart::before{left:0;top:0}.oo-heart::after{right:0;top:0}
@keyframes ooHeartBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}10%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot))}}


.puso-throb .word{animation:lyricThrob .72s ease-in-out infinite}.puso-throb .word.current{animation:lyricThrobCurrent .48s ease-in-out infinite}
@keyframes lyricThrob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.025)}}
@keyframes lyricThrobCurrent{0%,100%{transform:translateY(-.055em) scale(1.06)}50%{transform:translateY(-.09em) scale(1.13)}}
.puso-bg-heart{position:absolute;left:var(--x);top:var(--y);font-size:var(--size);line-height:1;color:currentColor;opacity:0;transform:scale(.88);animation:pusoBgPulse var(--life) ease-in-out infinite;filter:drop-shadow(0 0 10px #ffb38a22);pointer-events:none}
@keyframes pusoBgPulse{
  0%{opacity:.025;transform:translate3d(0,8px,0) scale(.82) rotate(-5deg)}
  24%{opacity:.11;transform:translate3d(-12px,-8px,0) scale(1.02) rotate(4deg)}
  52%{opacity:.18;transform:translate3d(10px,3px,0) scale(1.16) rotate(-3deg)}
  76%{opacity:.09;transform:translate3d(-7px,-12px,0) scale(.96) rotate(6deg)}
  100%{opacity:.025;transform:translate3d(6px,8px,0) scale(.84) rotate(-4deg)}
}

/* PUSO heart burst — exists only while the PUSO cue is active */
#heartField{
  position:absolute;
  inset:0;
  z-index:6;
  overflow:hidden;
  pointer-events:none;
}
.puso-heart{
  position:absolute;
  left:0;
  top:0;
  width:auto;
  height:auto;
  color:#ffb38a;
  font-size:var(--size);
  line-height:1;
  opacity:0;
  text-shadow:0 0 14px #ffb38a66;
  transform:translate(-50%,-50%) scale(.25);
  animation:pusoHeartBurst var(--life) cubic-bezier(.18,.72,.25,1) forwards;
  will-change:transform,opacity;
}
@keyframes pusoHeartBurst{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.25) rotate(0deg);
  }
  12%{opacity:.95}
  72%{opacity:.72}
  100%{
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1)
      rotate(var(--rot));
  }
}

/* "banat na 'to" echo field — only visible during 00:21–00:23 */
#backgroundBanat{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;opacity:1}
.banat-echo{
  position:absolute;
  white-space:nowrap;
  color:#fff;
  opacity:0;
  font-weight:800;
  letter-spacing:-.06em;
  mix-blend-mode:screen;
  animation:banatEchoInOut var(--life,1.9s) ease-out forwards;
}
@keyframes banatEchoInOut{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.78) rotate(var(--rot));
  }
  15%{opacity:var(--alpha)}
  68%{opacity:calc(var(--alpha) * .72)}
  100%{
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1.08)
      rotate(var(--rot));
  }
}

#echoes{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.echo{
  position:absolute;font-weight:800;white-space:nowrap;color:#fff;opacity:0;
  mix-blend-mode:screen;letter-spacing:-.08em;filter:blur(.2px);
}
.echo.show{animation:echo 1.15s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes echo{
  0%{opacity:0;transform:translate(0,0) scale(.65) rotate(var(--r))}
  18%{opacity:.08}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r))}
}

#hint{
  position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);
  z-index:11;text-align:center;color:#c8bdb3;
  font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.14em;text-transform:uppercase;transition:opacity .5s;
}
.playing #hint{opacity:0;pointer-events:none}
.play{
  border:1px solid #ffffff35;background:#ffffff08;
  backdrop-filter:blur(10px);border-radius:999px;padding:12px 20px;
  cursor:pointer;transition:.2s;
}
.play:hover{background:#ffffff14;transform:translateY(-1px)}

#controls{
  position:absolute;left:4vw;right:4vw;bottom:4.5vh;z-index:12;
  display:flex;align-items:center;gap:15px;
}
.ctrl{
  width:42px;height:42px;border:1px solid #ffffff2d;background:#ffffff09;
  border-radius:50%;cursor:pointer;flex:0 0 auto;transition:.18s;
}
.ctrl:hover{background:#ffffff15;transform:scale(1.04)}
.track{
  height:5px;background:#ffffff20;flex:1;position:relative;
  cursor:pointer;border-radius:99px;touch-action:none;
}
.progress{
  position:absolute;left:0;top:0;height:100%;width:0;
  background:var(--accent);box-shadow:0 0 14px #ffb38a77;border-radius:99px;
}
.track::before{
  content:"";position:absolute;inset:-10px 0; /* larger touch target */
}
.time{
  font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#bcaea1;min-width:88px;text-align:right;
}
#section{
  position:absolute;right:4vw;top:50%;
  transform:translateY(-50%) rotate(90deg);transform-origin:right center;
  color:#8f8379;font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.2em;text-transform:uppercase;z-index:10;
}
.flash{
  position:absolute;inset:0;background:#fff;opacity:0;z-index:9;pointer-events:none;
}
.flash.hit{animation:flash .14s ease-out}
@keyframes flash{0%{opacity:.11}100%{opacity:0}}

#scrubLabel{
  position:absolute;bottom:calc(4.5vh + 54px);right:4vw;z-index:13;
  opacity:0;transform:translateY(5px);pointer-events:none;
  padding:5px 8px;border:1px solid #ffffff18;border-radius:7px;
  background:#0d0b0add;backdrop-filter:blur(8px);
  font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfc1b4;
  transition:.15s;
}
.scrubbing #scrubLabel{opacity:1;transform:translateY(0)}


/* playful / makulit typography */
.line.active .word.visible:not(.current){animation:wordPop .42s cubic-bezier(.18,.9,.25,1.35) both}
.line.chorus.active .word.visible{animation:chorusPop .5s cubic-bezier(.16,1,.3,1.15) both}
.line.big.active .word.visible{animation:bigBounce .55s cubic-bezier(.15,1.2,.25,1) both}
.word.stretch{letter-spacing:.015em;transform-origin:left center}
.line.active .word.stretch.visible{animation:stretchWiggle .8s cubic-bezier(.2,.9,.25,1.15) both}
.question-mark{display:inline-block;margin-left:.03em;opacity:0;transform:translateY(.3em) rotate(-8deg) scale(.8);color:var(--accent);transition:.28s cubic-bezier(.2,.9,.2,1)}
.question-mark.visible{opacity:1;transform:translateY(-.02em) rotate(8deg) scale(1.08);animation:qBounce .5s ease-out both}
.word.deny{position:relative}
.word.deny.crossed{color:#cbbfb5;transform:translateY(.02em) rotate(-2deg) scale(1)}
.word.deny.crossed::after{content:"";position:absolute;left:-.08em;right:-.08em;top:52%;height:.075em;background:var(--accent);box-shadow:0 0 10px #ffb38a55;transform:rotate(-7deg) scaleX(0);transform-origin:left center;animation:crossOut .35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wordPop{0%{transform:translateY(.3em) scale(.86) rotate(var(--tilt,0deg));opacity:.15}55%{transform:translateY(-.07em) scale(1.055) rotate(calc(var(--tilt,0deg) * -1));opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes chorusPop{0%{transform:translateY(.22em) scale(.72) rotate(-5deg);opacity:.05}60%{transform:translateY(-.08em) scale(1.12) rotate(2deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes bigBounce{0%{transform:translateY(.4em) scale(.65) rotate(-4deg);opacity:0}58%{transform:translateY(-.09em) scale(1.13) rotate(2deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes stretchWiggle{0%{transform:translateY(.25em) scaleX(.7);opacity:.15}35%{transform:translateY(-.08em) scaleX(1.08) rotate(-1deg);opacity:1}65%{transform:translateY(.025em) scaleX(1.18) rotate(1deg)}100%{transform:translateY(0) scaleX(1.08) rotate(0);opacity:1}}
@keyframes qBounce{0%{transform:translateY(.3em) rotate(-12deg) scale(.7)}60%{transform:translateY(-.08em) rotate(12deg) scale(1.15)}100%{transform:translateY(-.02em) rotate(8deg) scale(1.08)}}
@keyframes crossOut{to{transform:rotate(-7deg) scaleX(1)}}



/* --- EXTRA MOTION LANGUAGE: SLIT / SQUIGGLE / WIND / CLOCK --- */
.line.scene-slit{gap:.015em .11em;overflow:visible}
.line.scene-slit .word{clip-path:inset(0 0 0 0);}
.line.scene-slit .word.visible{animation:slitIn .62s cubic-bezier(.12,1.2,.25,1) both,slitFloat 2.4s ease-in-out .62s infinite alternate}
.line.scene-slit .word:nth-child(odd){--slit-x:-1}
.line.scene-slit .word:nth-child(even){--slit-x:1}
@keyframes slitIn{
  0%{opacity:0;transform:translateX(calc(var(--slit-x)*65px)) scaleX(.05);clip-path:inset(0 48% 0 48%);filter:blur(5px)}
  45%{opacity:1;transform:translateX(calc(var(--slit-x)*14px)) scaleX(1.12);clip-path:inset(0 0 0 0);filter:blur(0)}
  72%{transform:translateX(calc(var(--slit-x)*-5px)) scaleX(.96)}
  100%{opacity:1;transform:none}
}
@keyframes slitFloat{0%{transform:translateY(2px) rotate(-.8deg)}100%{transform:translateY(-4px) rotate(.8deg)}}

.line.scene-squiggle{gap:.02em .10em}
.line.scene-squiggle .word.visible{animation:squiggleIn .5s cubic-bezier(.15,1.3,.3,1) both,squiggleLoop 1.35s ease-in-out .5s infinite}
@keyframes squiggleIn{0%{opacity:0;transform:translateY(35px) rotate(-12deg) scale(.7)}65%{opacity:1;transform:translateY(-7px) rotate(8deg) scale(1.08)}100%{opacity:1;transform:none}}
@keyframes squiggleLoop{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(3px,-3px) rotate(3deg)}
  40%{transform:translate(-4px,4px) rotate(-4deg)}
  60%{transform:translate(4px,2px) rotate(3deg)}
  80%{transform:translate(-2px,-3px) rotate(-2deg)}
}

.line.scene-wind{gap:.015em .08em;perspective:900px}
.line.scene-wind .word.visible{animation:windIn .7s cubic-bezier(.12,1.15,.3,1) both,windDrift 3.1s ease-in-out .7s infinite alternate}
@keyframes windIn{0%{opacity:0;transform:translate3d(-90px,28px,0) rotate(-12deg) skewX(-12deg);filter:blur(8px)}55%{opacity:1;transform:translate3d(15px,-5px,20px) rotate(4deg) skewX(3deg);filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes windDrift{0%{transform:translate3d(-5px,2px,0) rotate(-1deg) skewX(-1deg)}100%{transform:translate3d(9px,-5px,0) rotate(2deg) skewX(2deg)}}


/* 9 — words fly in from every corner, then keep a tiny mid-air drift */
.line.scene-fly{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.02em .14em;perspective:1100px}
.line.scene-fly .word{animation:flyIn .72s cubic-bezier(.12,1.25,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.line.scene-fly .word:nth-child(3n+1){font-size:1.18em;transform-origin:center}
.line.scene-fly .word:nth-child(3n+2){font-size:.76em;letter-spacing:.10em}
.line.scene-fly .word:nth-child(4n){transform:scaleX(.72)}
@keyframes flyIn{0%{opacity:0;transform:translate3d(var(--fx),var(--fy),-500px) rotate(var(--fr)) scale(.35)}65%{opacity:1;transform:translate3d(0,0,40px) rotate(calc(var(--fr)*-.15)) scale(1.08)}100%{opacity:1;transform:translate3d(0,0,0) rotate(0) scale(1)}}
.line.scene-fly .word.visible{animation-name:flyIn,flyFloat;animation-duration:.72s,2.8s;animation-delay:calc(var(--i)*70ms),calc(.72s + var(--i)*70ms);animation-iteration-count:1,infinite;animation-direction:normal,alternate}
@keyframes flyFloat{from{translate:0 0;rotate:0deg}to{translate:0 -7px;rotate:1.5deg}}

/* 10 — words crawl along a loose figure-eight / snake path */
.line.scene-crawl{position:relative;width:min(88vw,760px);height:min(46vh,390px);display:block}
.line.scene-crawl .word{position:absolute;left:50%;top:50%;margin:0;white-space:nowrap;opacity:0}
.line.scene-crawl .word.visible{opacity:1;animation:crawlIn .5s cubic-bezier(.15,1.25,.3,1) both}
@keyframes crawlIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-30deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(5deg)}100%{opacity:1}}

/* 11 — words literally flip from one line to the next */
.line.scene-flip{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:.02em .12em;perspective:1000px;max-width:92vw}
.line.scene-flip .word{transform-style:preserve-3d;backface-visibility:hidden;animation:flipLine .78s cubic-bezier(.18,1.15,.25,1) both;animation-delay:calc(var(--i)*85ms)}
.line.scene-flip .word:nth-child(odd){font-size:1.16em}
.line.scene-flip .word:nth-child(even){font-size:.82em;transform:scaleX(.82)}
@keyframes flipLine{0%{opacity:0;transform:translateY(-1.15em) rotateX(-90deg) rotateZ(-8deg) scale(.8)}45%{opacity:1;transform:translateY(.25em) rotateX(55deg) rotateZ(3deg) scale(1.05)}75%{transform:translateY(-.08em) rotateX(-12deg) rotateZ(-1deg)}100%{opacity:1;transform:translateY(0) rotateX(0) rotateZ(0) scale(1)}}

/* 12 — typography gets intentionally stretched/squeezed like rubber */
.line.scene-rubber{display:flex;flex-wrap:wrap;justify-content:center;gap:.03em .08em}
.line.scene-rubber .word{animation:rubberIn .55s cubic-bezier(.15,1.35,.3,1) both;animation-delay:calc(var(--i)*55ms)}
.line.scene-rubber .word:nth-child(1){font-size:1.35em;transform:scaleX(.62)}
.line.scene-rubber .word:nth-child(2n){font-size:.74em;transform:scaleX(1.35)}
.line.scene-rubber .word:nth-child(3n){font-size:1.08em;transform:scaleX(.78)}
@keyframes rubberIn{0%{opacity:0;transform:scaleX(.1) scaleY(1.4) rotate(-6deg)}55%{opacity:1;transform:scaleX(1.18) scaleY(.88) rotate(2deg)}100%{opacity:1;transform:scaleX(1) scaleY(1) rotate(0)}}

/* continuous typography variety */
.line.motion .word:nth-child(5n+1){letter-spacing:.01em}
.line.motion .word:nth-child(5n+2){letter-spacing:.08em}
.line.motion .word:nth-child(5n+3){letter-spacing:-.035em}
.line.motion .word:nth-child(4n){font-size:.88em}
.line.motion .word:nth-child(7n+1){font-size:1.12em}

.clock-wrap{position:relative;width:min(94vw,760px);height:min(52vh,450px);display:grid;place-items:center}
.clock-face{position:absolute;width:min(70vw,320px);height:min(70vw,320px);border:1px solid #ffffff30;border-radius:50%;opacity:.9;background:radial-gradient(circle,#ffb38a08 0 55%,transparent 72%);box-shadow:0 0 45px #ffb38a0c inset,0 0 24px #ffb38a12}
/* Clock-number bursts sit above the clock face but below the lyric words. */
.line.scene-clock .clock-face{z-index:1}
.line.scene-clock .clock-lyric{z-index:5}
.clock-face::before{content:"";position:absolute;inset:7%;border:1px solid #ffffff14;border-radius:50%}
.clock-face::after{content:"";position:absolute;inset:1.8%;border:1px dotted #ffb38a18;border-radius:50%;animation:clockOrbit 14s linear infinite}
.clock-number{position:absolute;left:50%;top:50%;font:600 clamp(9px,1.9vw,13px) ui-monospace,SFMono-Regular,Menlo,monospace;color:#c7bbb0;transform:translate(-50%,-50%);opacity:0;animation:clockNumberIn .48s cubic-bezier(.15,1.35,.3,1) forwards;animation-delay:calc(var(--n)*28ms)}
@keyframes clockNumberIn{0%{opacity:0}70%{opacity:1}100%{opacity:.9}}
.clock-tick{position:absolute;left:50%;top:50%;width:1px;height:4px;background:#ffffff20;transform-origin:center center;border-radius:2px}
.clock-tick.major{width:1px;height:8px;background:#ffffff38}
@keyframes clockOrbit{to{transform:rotate(360deg)}}


/* FIRST "Kahit 'di maganda ang mga linyahan" treatment.
   The six words are a deliberate vertical stack. They do not fly.
   Each word has a restrained physical shake; "linyahan" gets the
   directional dashed-line hit, then the whole stack folds away into
   the next lyric. */
.line.first-linyahan-vertical{
  width:min(92vw,560px);
  height:min(58vh,520px);
  min-height:0;
  display:flex;
  flex-direction:column;
  flex-wrap:nowrap;
  align-items:center;
  justify-content:center;
  align-content:center;
  gap:0;
  overflow:visible;
  z-index:5;
}
.line.first-linyahan-vertical .word{
  display:block;
  margin:0;
  line-height:.92;
  white-space:nowrap;
  will-change:transform,opacity;
  animation:none!important;
}
/* First-linyahan words use only the final bob animation below. */

/* Dashed "slashes" cross the entire screen from different directions.
   The trail follows the dash front instead of appearing as a static X. */
.linyahan-dash-field{
  position:absolute;
  inset:-20vh -20vw;
  z-index:12;
  pointer-events:none;
  overflow:visible;
  opacity:0;
}
.first-linyahan-vertical.linyahan-hit .linyahan-dash-field{
  opacity:1;
}
.linyahan-dash{
  position:absolute;
  left:50%;
  top:50%;
  width:145vw;
  height:0;
  border-top:2px dashed #ffb38a;
  filter:drop-shadow(0 0 5px #ffb38a99);
  opacity:0;
  transform-origin:center;
  will-change:transform,opacity;
}
.first-linyahan-vertical.linyahan-hit .linyahan-dash{
  animation:linyahanDashSweep var(--dash-life) cubic-bezier(.18,.75,.18,1) var(--dash-delay) both;
}
.linyahan-dash::after{
  content:"";
  position:absolute;
  left:0;
  top:-3px;
  width:34%;
  height:5px;
  background:linear-gradient(90deg,transparent,#fff2e8,#ffb38a,transparent);
  filter:blur(1px);
  opacity:.8;
  transform:translateX(-100%);
}
.first-linyahan-vertical.linyahan-hit .linyahan-dash::after{
  animation:dashTrail var(--dash-life) cubic-bezier(.18,.75,.18,1) var(--dash-delay) both;
}
@keyframes linyahanDashSweep{
  0%{
    opacity:0;
    transform:translate3d(var(--dash-x),var(--dash-y),0) rotate(var(--dash-r)) scaleX(.72);
  }
  16%{opacity:.95}
  42%{
    opacity:.9;
    transform:translate3d(0,0,0) rotate(var(--dash-r)) scaleX(1);
  }
  70%{
    opacity:.58;
    transform:translate3d(calc(var(--dash-x)*-.34),calc(var(--dash-y)*-.34),0) rotate(var(--dash-r)) scaleX(1.08);
  }
  100%{
    opacity:0;
    transform:translate3d(calc(var(--dash-x)*-.9),calc(var(--dash-y)*-.9),0) rotate(var(--dash-r)) scaleX(1.22);
  }
}
@keyframes dashTrail{
  0%{opacity:0;transform:translateX(-100%)}
  18%{opacity:.9}
  55%{opacity:.62;transform:translateX(95%)}
  100%{opacity:0;transform:translateX(330%)}
}

/* After the final dash passes, the stack gets pulled upward into the
   following line rather than simply blinking away. */
.line.first-linyahan-vertical.out{
  animation:linyahanStackExit .58s cubic-bezier(.18,.8,.2,1) forwards!important;
}
@keyframes linyahanStackExit{
  0%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  45%{opacity:1;transform:translateY(-4px) scale(1.015);filter:blur(0)}
  100%{opacity:0;transform:translateY(-48px) scale(.91);filter:blur(7px)}
}
.first-linyahan-vertical.out .linyahan-dash-field{
  opacity:1;
  animation:dashFieldExit .55s ease-out forwards;
}
@keyframes dashFieldExit{
  0%{opacity:.55;transform:scale(1)}
  100%{opacity:0;transform:scale(1.08)}
}

/* FIRST-CHORUS — horizontal line behind the stacked words. */
.first-linyahan-stroke{
  position:absolute;
  z-index:1;
  pointer-events:none;
  opacity:0;
  will-change:transform,opacity;
  border:0;
  background:repeating-linear-gradient(90deg,#ffb38a 0 12px,transparent 12px 23px);
  box-shadow:0 0 9px #ffb38a55;
}
.first-linyahan-vertical.active .first-linyahan-stroke{
  animation-timing-function:cubic-bezier(.18,.8,.18,1);
  animation-fill-mode:forwards;
}

/* Many independent edge-to-edge strokes. Every stroke still travels from one
   side of the viewport to the opposite side; only its entry edge, angle,
   speed, thickness and opacity vary. */
.first-linyahan-stroke-h{
  left:-125vw; width:150vw; height:var(--thick,2px);
  top:var(--y,50%);
  background:repeating-linear-gradient(90deg,#ffb38a 0 var(--dash,12px),transparent var(--dash,12px) calc(var(--dash,12px) + var(--gap,11px)));
  animation-name:firstLinyahanTravelH;
  animation-duration:var(--dur,3.2s);
  animation-delay:var(--delay,0s);
  animation-timing-function:linear!important;
}
.first-linyahan-stroke-h.reverse{
  left:auto; right:-125vw;
  animation-name:firstLinyahanTravelHReverse;
}
.first-linyahan-stroke-v{
  top:-125vh; left:var(--x,50%); width:var(--thick,2px); height:150vh;
  background:repeating-linear-gradient(0deg,#ffb38a 0 var(--dash,12px),transparent var(--dash,12px) calc(var(--dash,12px) + var(--gap,11px)));
  animation-name:firstLinyahanTravelV;
  animation-duration:var(--dur,3.2s);
  animation-delay:var(--delay,0s);
  animation-timing-function:linear!important;
}
.first-linyahan-stroke-v.reverse{
  top:auto; bottom:-125vh;
  animation-name:firstLinyahanTravelVReverse;
}
.first-linyahan-stroke-d{
  width:155vw; height:var(--thick,2px);
  left:-130vw; top:var(--y,50%);
  transform:rotate(var(--angle,25deg));
  transform-origin:center center;
  background:repeating-linear-gradient(90deg,#ffb38a 0 var(--dash,11px),transparent var(--dash,11px) calc(var(--dash,11px) + var(--gap,14px)));
  animation-name:firstLinyahanTravelD;
  animation-duration:var(--dur,3.4s);
  animation-delay:var(--delay,0s);
  animation-timing-function:linear!important;
}
.first-linyahan-stroke-d.reverse{
  left:auto; right:-130vw;
  animation-name:firstLinyahanTravelDReverse;
}
@keyframes firstLinyahanTravelH{
  0%{opacity:0;transform:translateX(-18vw)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(150vw)}
  100%{opacity:0;transform:translateX(175vw)}
}
@keyframes firstLinyahanTravelHReverse{
  0%{opacity:0;transform:translateX(18vw)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(-150vw)}
  100%{opacity:0;transform:translateX(-175vw)}
}
@keyframes firstLinyahanTravelV{
  0%{opacity:0;transform:translateY(-18vh)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateY(150vh)}
  100%{opacity:0;transform:translateY(175vh)}
}
@keyframes firstLinyahanTravelVReverse{
  0%{opacity:0;transform:translateY(18vh)}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateY(-150vh)}
  100%{opacity:0;transform:translateY(-175vh)}
}
@keyframes firstLinyahanTravelD{
  0%{opacity:0;transform:translateX(-145vw) rotate(var(--angle,25deg))}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(145vw) rotate(var(--angle,25deg))}
  100%{opacity:0;transform:translateX(175vw) rotate(var(--angle,25deg))}
}
@keyframes firstLinyahanTravelDReverse{
  0%{opacity:0;transform:translateX(145vw) rotate(var(--angle,-25deg))}
  8%{opacity:var(--op,.5)}
  88%{opacity:var(--op,.5);transform:translateX(-145vw) rotate(var(--angle,-25deg))}
  100%{opacity:0;transform:translateX(-175vw) rotate(var(--angle,-25deg))}
}
.line.first-linyahan-vertical.out{animation:none!important;}
.line.first-linyahan-vertical.out .first-linyahan-stroke{animation:firstLinyahanStrokeOut .28s ease-in forwards!important;}
@keyframes firstLinyahanStrokeOut{from{opacity:inherit}to{opacity:0}}

/* Keep the older dashed-line machinery inactive for this treatment. */
.first-linyahan-vertical .linyahan-dash-field{
  display:none!important;
}

/* Old i=6 cursive-clock lyric treatment removed: replaced by .scene-bibigay-stack. */
.line.scene-clock.clock-whimsy-skill .clock-lyric{
  transform:translate(-50%,-50%) rotate(1.2deg) scale(1.02);
}
.line.scene-clock.clock-whimsy-skill .clock-lyric .word.visible{
  animation:playfulClockInSecond .52s cubic-bezier(.1,1.5,.2,1) both,
            playfulClockHop 1.05s ease-in-out .52s infinite;
  animation-delay:calc(var(--i)*.065s),calc(.62s + var(--i)*.055s);
}
@keyframes playfulClockIn{
  0%{opacity:0;transform:translate3d(-18px,34px,0) rotate(-16deg) scale(.45)}
  38%{opacity:1;transform:translate3d(8px,-12px,0) rotate(10deg) scale(1.18)}
  62%{transform:translate3d(-5px,5px,0) rotate(-7deg) scale(.94)}
  82%{transform:translate3d(3px,-3px,0) rotate(4deg) scale(1.04)}
  100%{opacity:1;transform:none}
}
@keyframes playfulClockDance{
  0%,100%{transform:translate3d(0,0,0) rotate(-2deg) scale(1)}
  18%{transform:translate3d(-3px,-6px,0) rotate(4deg) scale(1.03)}
  36%{transform:translate3d(4px,2px,0) rotate(-3deg) scale(.98)}
  55%{transform:translate3d(-2px,-4px,0) rotate(2deg) scale(1.025)}
  76%{transform:translate3d(3px,1px,0) rotate(-1deg) scale(1)}
}
@keyframes playfulClockInSecond{
  0%{opacity:0;transform:translate3d(20px,-36px,0) rotate(15deg) scale(.42)}
  32%{opacity:1;transform:translate3d(-8px,10px,0) rotate(-11deg) scale(1.2)}
  58%{transform:translate3d(5px,-5px,0) rotate(7deg) scale(.93)}
  80%{transform:translate3d(-3px,3px,0) rotate(-3deg) scale(1.05)}
  100%{opacity:1;transform:none}
}
@keyframes playfulClockHop{
  0%,100%{transform:translate3d(0,0,0) rotate(1deg) scale(1)}
  20%{transform:translate3d(0,-8px,0) rotate(-5deg) scale(1.04)}
  42%{transform:translate3d(4px,2px,0) rotate(4deg) scale(.97)}
  64%{transform:translate3d(-4px,-5px,0) rotate(-3deg) scale(1.06)}
  84%{transform:translate3d(2px,1px,0) rotate(2deg) scale(1)}
}

/* The clock is almost frozen: only the second hand is alive and fast. */
.line.scene-clock .clock-hand{transition:none;will-change:transform}

.clock-hands{position:absolute;inset:0;pointer-events:none;z-index:1}

/* --- PUSO / HEARTBEAT ENHANCEMENT --- */

  align-items:center;

}
.line.scene-heart-split .heart-anchor .word{position:relative;z-index:3}
.heart-field{
  position:absolute;
  left:50%;
  top:50%;
  width:min(70vw,560px);
  height:150px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:1;
  overflow:visible;
}
.heart{
  position:absolute;
  left:50%;
  top:55%;
  color:#ffb38a;
  font-size:clamp(16px,2.4vw,32px);
  line-height:1;
  opacity:0;
  filter:drop-shadow(0 0 10px #ffb38a55);
  text-shadow:0 0 18px #ffb38a66;
  transform:translate(-50%,-50%) scale(.2) rotate(var(--hr));
  animation:heartFloat var(--hd,2.8s) cubic-bezier(.2,.7,.2,1) forwards;
}
.line.scene-heart-split .puso-heart-pop{
  animation-duration:1.55s;
  filter:drop-shadow(0 0 14px #ffb38a88);
}
.line.scene-heart-split .mo-heart-pop{
  animation:heartFloatMo 1.35s cubic-bezier(.12,.9,.2,1) forwards;
  filter:drop-shadow(0 0 18px #ffb38aaa);
}
@keyframes heartFloatMo{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(var(--hr))}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.28) rotate(var(--hr))}
  34%{opacity:.95;transform:translate(calc(-50% + var(--dx)*.35),calc(-50% + var(--dy)*.25)) scale(1.05) rotate(calc(var(--hr) + 7deg))}
  68%{opacity:.58;transform:translate(calc(-50% + var(--dx)*.72),calc(-50% + var(--dy)*.72)) scale(.76) rotate(calc(var(--hr) - 5deg))}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.38) rotate(calc(var(--hr) + 10deg))}
}
@keyframes heartFloat{
  0%{opacity:0;transform:translate(-50%,-35%) scale(.2) rotate(var(--hr))}
  12%{opacity:.95;transform:translate(calc(-50% + var(--hx0)),calc(-50% + 4px)) scale(1.05) rotate(var(--hr))}
  45%{opacity:.78;transform:translate(calc(-50% + var(--hx1)),calc(-50% - 45px)) scale(.92) rotate(calc(var(--hr) + 5deg))}
  78%{opacity:.45;transform:translate(calc(-50% + var(--hx2)),calc(-50% - 95px)) scale(.76) rotate(calc(var(--hr) - 4deg))}
  100%{opacity:0;transform:translate(calc(-50% + var(--hx3)),calc(-50% - 145px)) scale(.45) rotate(calc(var(--hr) + 8deg))}
}
/* Stronger idle movement: the words subtly tremble between lyric cues. */
/* Idle heartbeat is applied in updateMotion() with independent CSS transform properties, so it never cancels a scene's entrance animation. */
.line.active .word.visible:not(.current){will-change:transform,translate,rotate,scale}

/* The synchronized music beat gives all idle words a second, sharper pulse. */

}
#app.beat .line.scene-heart-split .word.current{

  text-shadow:0 0 34px #ffb38a77;
}

/* WORD-BY-WORD BACKGROUND ECHO — "Pwede ba kitang ligawan?" */
.line.word-echo-scene .word{
  position:relative;
  z-index:1;
}
/* Keep the 1:03 "ligawan?" word in the exact same type as the rest of the chorus.
   The generic 4th-word sizing rule was shrinking it, which made the highlighted
   word look like it switched fonts. */
.line.word-echo-scene .word[data-word-index="3"]{
  font-family:inherit !important;
  font-size:1em !important;
  font-weight:inherit !important;
  letter-spacing:inherit !important;
  line-height:inherit !important;
}
/* Keep 1:03 "ligawan?" exactly the same physical size when highlighted.
   The global .word.current rule scales highlighted words to 1.06. */
.line.word-echo-scene .word[data-word-index="3"].current{
  transform:translateY(-.055em) scale(1) !important;
  scale:1 !important;
}
.line.word-echo-scene .word::before{
  content:attr(data-echo);
  position:absolute;
  left:50%;
  top:50%;
  z-index:-1;
  display:block;
  white-space:nowrap;
  font-family:inherit;
  font-size:1em;
  font-weight:inherit;
  letter-spacing:inherit;
  line-height:inherit;
  color:var(--echo-color,#ffb38a);
  opacity:0;
  filter:blur(1.5px);
  pointer-events:none;
  transform:translate(-50%,-50%) translate(var(--echo-x,0px),var(--echo-y,0px)) scale(var(--echo-scale,1.75)) rotate(var(--echo-rot,0deg));
  transform-origin:center;
  animation:wordEchoIn .72s cubic-bezier(.16,1.15,.25,1) forwards,
            wordEchoBob var(--echo-dur,2.8s) ease-in-out var(--echo-delay,.2s) infinite alternate;
}
.line.word-echo-scene .word:nth-of-type(1)::before{--echo-scale:1.9;--echo-x:-2px;--echo-y:2px;--echo-rot:-2deg;--echo-color:#f8f0e6;--echo-delay:.05s;--echo-dur:3.1s}
.line.word-echo-scene .word:nth-of-type(2)::before{--echo-scale:2.2;--echo-x:3px;--echo-y:-1px;--echo-rot:2deg;--echo-color:#ffb38a;--echo-delay:.14s;--echo-dur:2.6s}
.line.word-echo-scene .word:nth-of-type(3)::before{--echo-scale:1.65;--echo-x:-3px;--echo-y:3px;--echo-rot:-1deg;--echo-color:#f8f0e6;--echo-delay:.23s;--echo-dur:3.4s}
.line.word-echo-scene .word:nth-of-type(4)::before{--echo-scale:2.0;--echo-x:2px;--echo-y:-2px;--echo-rot:1.5deg;--echo-color:#ffb38a;--echo-delay:.32s;--echo-dur:2.9s}
@keyframes wordEchoIn{
  0%{opacity:0;transform:translate(-50%,-50%) translate(var(--echo-x),calc(var(--echo-y) + 8px)) scale(.8) rotate(calc(var(--echo-rot) - 6deg))}
  65%{opacity:.19;transform:translate(-50%,-50%) translate(var(--echo-x),var(--echo-y)) scale(calc(var(--echo-scale) * 1.06)) rotate(calc(var(--echo-rot) + 2deg))}
  100%{opacity:.13;transform:translate(-50%,-50%) translate(var(--echo-x),var(--echo-y)) scale(var(--echo-scale)) rotate(var(--echo-rot))}
}
@keyframes wordEchoBob{
  0%{opacity:.10;transform:translate(-50%,-50%) translate(var(--echo-x),calc(var(--echo-y) + 3px)) scale(var(--echo-scale)) rotate(var(--echo-rot))}
  100%{opacity:.15;transform:translate(-50%,-50%) translate(calc(var(--echo-x) + 3px),calc(var(--echo-y) - 4px)) scale(calc(var(--echo-scale) * 1.025)) rotate(calc(var(--echo-rot) + 1deg))}
}
.line.word-echo-scene.out .word::before{animation:wordEchoOut .38s ease-in forwards!important}

/* More energetic bob for the 1:03 chorus line. */
.line.word-echo-scene.active{
  animation:wordEchoSceneBob 1.15s cubic-bezier(.36,.07,.19,.97) infinite alternate !important;
}
@keyframes wordEchoSceneBob{
  0%{transform:translate3d(-7px,5px,0) rotate(-.55deg)}
  22%{transform:translate3d(5px,-8px,0) rotate(.7deg)}
  47%{transform:translate3d(-4px,7px,0) rotate(-.8deg)}
  71%{transform:translate3d(7px,-5px,0) rotate(.55deg)}

function fmt(s){
  s=Math.max(0,s||0);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+
         String(Math.floor(s%60)).padStart(2,'0');
}
function cleanWord(w){
  return w.toLowerCase().replace(/[.,!?“”‘’"()]/g,'').trim();
}
function buildWords(text){
  const parts=text.split(/(\s+)/).filter(Boolean);
  let wordIndex=0;
  return parts.map(part=>{
    if(/^\s+$/.test(part)) return part;
    const raw=part;
    if(/kitaaaaa/i.test(raw)){
      const m=raw.match(/^(kita)(a+)$/i);
      if(m){
        const aCount=m[2].length;
        const trail=Array.from({length:aCount},(_,j)=>`<span class="trail-a ${j>0?'follow':''}" style="--a-i:${j}">a</span>`).join('');
        const html=`<span class="word long-word stretch" data-word-index="${wordIndex}" style="--i:${wordIndex};--tilt:0deg"><span class="kita">kita</span>${trail}</span>`;
        wordIndex++;
        return html;
      }
    }
    const isQuestionHindi=raw.toLowerCase()==='hindi?';
    const base=isQuestionHindi?'hindi':raw;
    const clean=cleanWord(base);
    const accent=accentWords.has(clean);
    const scratch=(clean==='gasgas' || clean==='banat');
    const tilt=[-2,1,-1,2,0][wordIndex%5];
    const classes=['word'];
    if(accent)classes.push('accent');
    if(scratch)classes.push('scratch-word');
    if(clean==='magaling')classes.push('magaling-word');
    if(isQuestionHindi)classes.push('deny');
    const flyX=((wordIndex%2?-1:1)*(80+((wordIndex*47)%180)))+'px';
    const flyY=((wordIndex%3-1)*(70+((wordIndex*31)%150)))+'px';
    const flyR=((wordIndex%2?-1:1)*(8+(wordIndex%5)*7))+'deg';
    if(clean==='puso')classes.push('puso-word');
    if(clean==='gasgas')classes.push('gasgas-word');
    const html=`<span class="${classes.join(' ')}" data-word-index="${wordIndex}" style="--i:${wordIndex};--tilt:${tilt}deg;--fx:${flyX};--fy:${flyY};--fr:${flyR}">${base}</span>`;
    wordIndex++;
    if(isQuestionHindi) return html+'<span class="question-mark" data-question-index="'+(wordIndex-1)+'">?</span>';
    return html;
  }).join('');
}


function buildHeartSplitLine(text){
  const temp=document.createElement('div');
  temp.innerHTML=buildWords(text);
  const top=document.createElement('div');
  top.className='lyric-part top';
  const bottom=document.createElement('div');
  bottom.className='lyric-part heart-line';
  const field=document.createElement('div');
  field.className='heart-field';
  field.setAttribute('aria-hidden','true');
  bottom.appendChild(field);

  [...temp.childNodes].forEach(node=>{
    const word=node.nodeType===1 && node.classList.contains('word');
    const idx=word ? Number(node.dataset.wordIndex) : null;
    if(word && idx>=5){
      // Keep "sa puso mo" together while preserving their original cue indices.
      bottom.appendChild(node);
    }else{
      top.appendChild(node);
    }
  });

  // Put the heart emitter around the exact visual anchor for "puso".
  const puso=bottom.querySelector('.word[data-word-index="6"]');
  if(puso){
    const anchor=document.createElement('span');
    anchor.className='heart-anchor';
    puso.replaceWith(anchor);
    anchor.appendChild(puso);
  }
  const wrap=document.createDocumentFragment();
  wrap.appendChild(top);
  wrap.appendChild(bottom);
  return wrap;
}



function sceneFor(i){
  // Each lyric becomes a small motion-graphics scene.
  const scenes=[
    'fly','slit','kailan-flight','wind','zoom','squiggle','clock','clock',
    'fly','question','pupuntahan','malayo-echo','orbit','wind','rubber','chase',
    'longa','fly','clock','crawl','flip','zoom','question'
  ];
  return scenes[i]||'chase';
}

function buildBibigayStack(text){
  // Four centered rows, while preserving the original word order/cues:
  // Bibigay ko / nang buo / ang / oras ko
  const words=buildWords(text);
  const temp=document.createElement('div');
  temp.innerHTML=words;

  const rowSpecs=[
    [0,1],
    [2,3],
    [4],
    [5,6]
  ];

  const stack=document.createElement('div');
  stack.className='bibigay-stack';

  rowSpecs.forEach((indices,rowIndex)=>{
    const row=document.createElement('div');
    row.className='bibigay-row';
    row.dataset.row=rowIndex;

    indices.forEach(idx=>{
      const word=temp.querySelector(`.word[data-word-index="${idx}"]`);
      if(word) row.appendChild(word);
    });

    stack.appendChild(row);
  });

  return stack.outerHTML;
}

function buildClock(text){
  const nums=Array.from({length:12},(_,j)=>`<span class="clock-number" style="--n:${j}">${j===0?12:j}</span>`).join('');
  const ticks=Array.from({length:60},(_,j)=>`<i class="clock-tick ${j%5===0?'major':''}" data-tick="${j}"></i>`).join('');
  const lyric=(text==='Bibigay ko nang buo ang oras ko') ? buildBibigayStack(text) : buildWords(text);
  const sparks=Array.from({length:42},(_,i)=>{
    const angle=i*2.399963;
    const radius=34+(i%7)*7;
    const x=50+Math.cos(angle)*radius;
    const y=50+Math.sin(angle)*radius;
    const size=7+(i%9)*2.8;
    const opacity=(.18+(i%6)*.07).toFixed(2);
    const dx=Math.cos(angle+1.1)*(4+(i%5)*2);
    const dy=Math.sin(angle+1.1)*(5+(i%6)*2);
    const dur=(1.8+(i%8)*.38).toFixed(2);
    const delay=(0.06+(i%9)*0.075).toFixed(2);
    const rot=(-30+(i%13)*5);
    const color=i%7===0?'#f8f0e6':'#ffb38a';
    return `<span class="clock-spark" style="--sx:${x}%;--sy:${y}%;--ss:${size}px;--so:${opacity};--dx:${dx}px;--dy:${dy}px;--sd:${dur}s;--sdelay:${delay}s;--sr:${rot}deg;--sc:${color}">✦</span>`;
  }).join('');
  return `<div class="clock-wrap"><div class="clock-face"><div class="clock-hands"><i class="clock-hand hour"></i><i class="clock-hand minute"></i><i class="clock-hand second"></i><i class="clock-center"></i></div></div><div id="clockSparkField" aria-hidden="true">${sparks}</div><div class="clock-number-burst-layer" aria-hidden="true"></div><div class="clock-lyric ${text === "Bibigay ko nang buo ang oras ko" ? "bibigay-static" : ""}">${lyric}</div></div>`;
}

function layoutClock(){
  const el=L.querySelector('.line.active.scene-clock');
  if(!el)return;
  const face=el.querySelector('.clock-face');
  if(!face)return;
  const r=face.getBoundingClientRect().width*.44;
  el.querySelectorAll('.clock-number').forEach((n,i)=>{
    const a=(i/12)*Math.PI*2-Math.PI/2;
    n.style.transform=`translate(-50%,-50%) translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)`;
  });
  el.querySelectorAll('.clock-tick').forEach((tick,i)=>{
    const a=(i/60)*Math.PI*2-Math.PI/2;
    tick.style.transform=`translate(-50%,-50%) translate(${Math.cos(a)*r*.96}px,${Math.sin(a)*r*.96}px) rotate(${i*6}deg)`;
  });
}

function updateClock(t){
  const el=L.querySelector('.line.active');
  if(!el||!el.classList.contains('scene-clock'))return;
  // Both clock lyrics share ONE visual clock timeline.
  // Never derive the clock phase from the second lyric's start time.
  const startTime=lines[6].start;
  const elapsed=Math.max(0,t-startTime);
  // Real clock geometry: 60 seconds per revolution, 60 minutes per hour,
  // and the hour hand advances continuously with the minutes.
  // Whimsical accelerated clock: all three hands keep correct ratios,
  // but the whole clock visibly spins faster for the kinetic sequence.
  const clockSpeed=10;
  const secondDeg=elapsed*6*clockSpeed;
  const minuteDeg=elapsed*0.1*clockSpeed;
  const hourDeg=elapsed*(30/3600)*clockSpeed;
  const second=el.querySelector('.clock-hand.second');
  const minuteH=el.querySelector('.clock-hand.minute');
  const hourH=el.querySelector('.clock-hand.hour');
  if(second)second.style.transform=`translate(-50%,-100%) rotate(${secondDeg}deg)`;
  if(minuteH)minuteH.style.transform=`translate(-50%,-100%) rotate(${minuteDeg}deg)`;
  if(hourH)hourH.style.transform=`translate(-50%,-100%) rotate(${hourDeg}deg)`;
}


function buildLaserHeart(){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.classList.add('scene-laser-heart');
  svg.setAttribute('viewBox','0 0 720 300');
  svg.setAttribute('aria-hidden','true');

  // A laser line enters from the left, then continues seamlessly into one
  // large heart outline. The path ends where it began so the heart closes.
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.classList.add('laser-heart-path');

function activate(i){
  if(i===current)return;
  const old=L.querySelector('.line.active');

  // ONE persistent clock scene for the two consecutive lyrics.
  // Do not remove/recreate the line, face, ticks, numbers, or hands.
  // Only replace the lyric layer; the clock timeline keeps running from line 6.
  if(old && old.classList.contains('scene-clock') && (current===6 || current===7) && i===7){
    const item=lines[i];
    const lyric=old.querySelector('.clock-lyric');
    if(lyric){
      // ONLY replace the lyric contents. The clock DOM, its animations,
      // and its hand phase remain untouched.
      lyric.innerHTML=buildBibigayStack(item.text);
      lyric.classList.add('clock-whimsy-skill');
      lyric.classList.remove('clock-whimsy-time');
    }
    // Keep the host line permanently anchored to the first clock lyric.
    // The audio lyric index may advance to 7, but the visual clock never does.
    old.dataset.index='6';
    old.dataset.clockOriginIndex='6';
    old.classList.remove('out','clock-exit');
    current=i;
    SEC.textContent=item.section;
    return;
  }

  if(old){
    const oldIndex=Number(old.dataset.index);
    old.classList.remove('active');
    if(old.classList.contains('scene-clock')) old.classList.add('clock-exit');

    // The first chorus has its own timed fade (45.75–46.75). Do NOT stack
    // the generic .out animation on top of it when the next lyric enters.
    if(oldIndex===4 && i===5){
      old.classList.remove('question-chorus-pulse','question-chorus-fade');
      setTimeout(()=>old.remove(),40);
    }else{
      old.classList.add('out');
      setTimeout(()=>old.remove(),700);
    }
  }
  current=i;
  heartCueShown=false;
  if(i<0){
    SEC.textContent='outro';
    return;
  }
  const item=lines[i];
  const scene=(i===0)?'heart-split':sceneFor(i);
  const qClass=item.text==='Oo o hindi?'?' scene-question':'';
  const body=scene==='bibigay-stack'?buildBibigayStack(item.text):
             scene==='clock'?buildClock(item.text):
             scene==='heart-split'?buildHeartSplitLine(item.text):
             buildWords(item.text);
  let el;
  if(scene==='heart-split'){
    el=document.createElement('div');
    el.className=`line motion scene-heart-split ${item.style}${qClass}`;
    el.dataset.index=i;
    el.appendChild(body);
  }else{
    const specialClass = i===0 ? ' puso-scene' : '';
    el=document.createElement('div');
    el.className=`line motion scene-${scene} ${item.style}${qClass}${specialClass}`;
    el.dataset.index=i;
    el.innerHTML=body;
  }

  // Keep the outgoing lyric in the stage while the new lyric enters.
  // Previously L.replaceChildren()/L.innerHTML removed the old line instantly,
  // so its exit animation could never actually be seen. The overlap below gives
  // the first-half transitions a real crossfade instead of a hard cut.
  if(i<=9) el.classList.add('first-half-transition');
  L.appendChild(el);
  if(scene==='clock') el.dataset.clockOriginIndex=String(i);
  if(i===0) el.classList.add('puso-throb');
  if(i===4){

      ['25%','94%','clamp(24px,6vw,70px)',.095,  3, 1.4,-7, 5, 3.7,'#f8f0e6'],
      ['58%','91%','clamp(31px,7.3vw,86px)',.075, -3, 1.6, 5,-7, 2.8,'#ffb38a'],
      ['88%','94%','clamp(26px,6.4vw,75px)',.09,   7, 1.1,-6, 4, 3.3,'#f8f0e6']

    echoSpecs.forEach(([x,y,size,alpha,rot,delay,ex,ey,speed,color])=>{
      const e=document.createElement('span');
      e.className='malayo-echo';
      e.textContent="Kahit malayo pa yan";
      e.style.setProperty('--mx',x);
      e.style.setProperty('--my',y);
      e.style.setProperty('--ms',size);
      e.style.setProperty('--ma',alpha);
      e.style.setProperty('--mr',rot+'deg');
      e.style.setProperty('--md',delay+'s');

    });

    el.prepend(field);
  }

  if(i===5){
    el.classList.add('first-linyahan-vertical');
    el.querySelectorAll('.word').forEach((w,idx)=>{

    });
    const strokeSpecs=[
      ['h',false,18,2,.42,3.4,0.02,10,12],['h',true,30,3,.30,4.1,.18,16,17],

      ['h',false,68,4,.25,4.4,.70,20,18],['h',true,80,2,.55,3.0,.88,9,14],
      ['v',false,16,2,.38,3.8,.12,10,12],['v',true,29,3,.52,3.2,.30,15,15],
      ['v',false,43,1,.66,2.8,.46,7,11],['v',true,57,2,.32,4.0,.64,18,16],
      ['v',false,71,3,.50,3.5,.82,12,12],['v',true,84,1,.44,4.2,.96,9,18],
    ];
    strokeSpecs.forEach(([type,reverse,pos,thick,op,dur,delay,dash,gap])=>{
      const stroke=document.createElement('div');
      stroke.className='first-linyahan-stroke first-linyahan-stroke-'+type+(reverse?' reverse':'');
      stroke.setAttribute('aria-hidden','true');
      stroke.style.setProperty('--'+(type==='h'?'y':type==='v'?'x':'y'),pos+'%');
      stroke.style.setProperty('--thick',thick+'px');
      stroke.style.setProperty('--op',op);
      stroke.style.setProperty('--dur',dur+'s');
      stroke.style.setProperty('--delay',delay+'s');
      stroke.style.setProperty('--dash',dash+'px');
      stroke.style.setProperty('--gap',gap+'px');
      if(type==='d') stroke.style.setProperty('--angle',(reverse?-24:24)+'deg');
      el.appendChild(stroke);
    });
  }
  if(i===1){
    el.classList.add('banat-scratch');
    // The complete phrase "banat na 'to" gets the animated scratch treatment.
    el.querySelectorAll('.word[data-word-index="6"], .word[data-word-index="7"], .word[data-word-index="8"]').forEach(w=>w.classList.add('scratch-word'));
  }
  if(i===3) el.classList.add('gusto-shiver');
  if(i===7) el.classList.add('playful-clock-lyric','clock-whimsy-skill');
  SEC.textContent=item.section;
  requestAnimationFrame(()=>{el.classList.add('active'); if(scene==='clock') layoutClock();});

  if(scene==='zoom'){
    el.classList.add('motion-zoom');
    setTimeout(()=>el.classList.remove('motion-zoom'),750);
  }
  if(scene==='bump') layoutBump(el);
  if(scene==='crawl') layoutCrawl(el);
  if(scene==='flip') layoutFlip(el);
}

function layoutBump(el){
  const words=[...el.querySelectorAll('.word')];
  words.forEach((w,i)=>{
    const sx=(i%2===0?-1:1)*(55+((i*29)%75));
    const sy=(i%3-1)*(28+((i*17)%45));
    const bx=(i%2===0?1:-1)*(2+(i%3)*2);
    const by=(i%2===0?-1:1)*(2+(i%3));
    w.style.setProperty('--sx',sx+'px');
    w.style.setProperty('--sy',sy+'px');
    w.style.setProperty('--sr',((i%2?-1:1)*(4+i))+'deg');
    w.style.setProperty('--bx',bx+'px');
    w.style.setProperty('--by',by+'px');
    w.style.setProperty('--br',((i%2?-1:1)*(1.5+i%3))+'deg');
  });
}


function layoutCrawl(el){
  const words=[...el.querySelectorAll('.word')];
  const n=Math.max(words.length,1);
  words.forEach((w,i)=>{
    const phase=(i/Math.max(n-1,1))*Math.PI*2;
    w.style.setProperty('--crawl-phase',phase);
    w.style.setProperty('--crawl-i',i);
  });
}

function layoutFlip(el){
  [...el.querySelectorAll('.word')].forEach((w,i)=>{
    w.style.setProperty('--flip-y',((i%2)*1.1)+'em');
    w.style.setProperty('--flip-z',((i%2?-1:1)*(4+i%4))+'deg');
  });
}

function updateWords(t){
  const el=L.querySelector('.line.active');
  if(!el||current<0)return;
  const item=lines[current];
  const words=[...el.querySelectorAll('.word')];
  const cues=item.cues;
  let currentWord=-1;

  words.forEach((w,i)=>{
    const start=cues[i] ?? (item.start+(i/words.length)*(item.end-item.start));
    const visible=t>=start;
    w.classList.toggle('visible',visible);
    if(visible)currentWord=i;
  });
  words.forEach((w,i)=>w.classList.toggle('current',i===currentWord));

  if(current===4){
    const lw=el.querySelector('.word.ligawan-chaos');
    if(lw && currentWord!==Number(lw.dataset.wordIndex)) lw.classList.remove('current');
  }

  const q=el.querySelector('.question-mark');
  if(q){
    const hindi=el.querySelector('.word.deny');
    const hindiIndex=Number(hindi?.dataset.wordIndex ?? -1);
    const hindiCue=cues[hindiIndex] ?? item.start;
    const qVisible=t>=hindiCue;
    q.classList.toggle('visible',qVisible);
    if(hindi)hindi.classList.toggle('crossed',qVisible);
  }

}

function updateMotion(t){
  const el=L.querySelector('.line.active');
  if(!el||current<0)return;
  const item=lines[current];
  const scene=sceneFor(current);
  const words=[...el.querySelectorAll('.word')];

  if(scene==='kailan-flight'){
    // Lightweight, time-driven word flight. No observers, particles, or CSS
    // animations are involved, so this cannot interfere with page startup.
    const cues=item.cues||[];
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const vw=Math.max(document.documentElement.clientWidth||window.innerWidth||390,320);
    const vh=Math.max(document.documentElement.clientHeight||window.innerHeight||700,520);
    const distance=Math.hypot(vw,vh)*1.35;
    const directions=[
      [-1.00,-0.15],[0.72,-0.80],[0.98,0.35],[-0.70,0.82],
      [0.32,-1.00],[-0.92,-0.50],[0.82,0.70],[-0.25,1.00]
    ];
    const lastIndex=words.length-1;

    words.forEach((w,i)=>{
      const cue=cues[i] ?? item.start;
      const nextCue=cues[i+1] ?? item.end;
      const isLast=i===lastIndex;

      if(t<cue){
        w.style.opacity='0';
        w.style.transform='translate3d(-50%,-50%,0) scale(.9)';
        w.style.filter='none';
        return;
      }

      if(isLast){
        // Five pulses, each larger. The final pulse becomes the transition.
        const elapsed=t-cue;
        const pulseLength=.46;
        const pulseCount=3;
        const pulseTotal=pulseLength*pulseCount;

        if(elapsed<pulseTotal){
          const n=Math.min(pulseCount-1,Math.floor(elapsed/pulseLength));
          const phase=(elapsed%pulseLength)/pulseLength;
          const wave=Math.sin(phase*Math.PI);
          const base=[1,1.14,1.30][n];
          const scale=base+wave*(.06+n*.012);
          w.style.opacity='1';
          w.style.filter=`drop-shadow(0 0 ${12+n*8+wave*10}px #ffb38a88)`;
          w.style.transform=`translate3d(-50%,-50%,0) scale(${scale})`;
          w.style.zIndex='6';
          return;
        }

        const p=clamp((elapsed-pulseTotal)/.55,0,1);
        const e=p*p*(3-2*p);
        w.style.opacity=String(1-e);
        w.style.filter=`blur(${e*7}px) drop-shadow(0 0 ${35+e*80}px #ffb38acc)`;
        w.style.transform=`translate3d(-50%,-50%,0) scale(${1.74+e*4.5})`;
        w.style.zIndex='6';
        return;
      }

      // Hold the current word in the center until the next cue.
      // The center hold is deliberately lively: each word bobs, jitters and
      // glows while it owns the stage, instead of sitting statically.
      if(t<nextCue){
        const enter=clamp((t-cue)/.16,0,1);
        const elapsed=Math.max(0,t-cue);
        // Independent, energetic bob for each word: each word gets its own
        // phase and speed so they never move as one synchronized block.
        const chaos=t*(8.6+i*0.72)+i*1.37;
        const bobX=Math.sin(chaos)*8.5 + Math.sin(chaos*1.83+i*1.7)*4.2 + Math.cos(chaos*.63+i)*2.2;
        const bobY=Math.cos(chaos*1.12)*10.5 + Math.sin(chaos*2.07+i*.7)*4.6 + Math.cos(chaos*.57+i*1.3)*2.4;
        const bobR=Math.sin(chaos*.91+i)*4.4 + Math.cos(chaos*1.67+i*.4)*2.0;
        const pulse=1 + .028*Math.sin(chaos*1.31) + .018*Math.sin(chaos*2.43+i);
        const glow=24 + 24*(.5+.5*Math.sin(chaos*1.17+i*.8));
        w.style.opacity=String(enter);
        w.style.filter=`drop-shadow(0 0 ${glow}px #ffb38a99) drop-shadow(0 0 ${glow*.42}px #f8f0e688)`;
        w.style.transform=`translate3d(calc(-50% + ${bobX}px),calc(-50% + ${bobY}px),0) rotate(${bobR}deg) scale(${(.94+.06*enter)*pulse})`;
        w.style.zIndex='5';
        return;
      }

      // At the next word's cue, send the previous word fully off-screen.
      const [dx,dy]=directions[i%directions.length];
      const p=clamp((t-nextCue)/.42,0,1);
      const e=p*p*(3-2*p);
      const x=dx*distance*e;
      const y=dy*distance*e;
      w.style.opacity=String(1-e);
      w.style.filter=`blur(${e*3}px)`;
      w.style.zIndex='2';
      w.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),0) rotate(${(i%2?-1:1)*(7+i*2)*e}deg)`;
    });
  }

  if(scene==='crawl'){
    const n=Math.max(words.length,1);
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const phase=(i/Math.max(n,1))*Math.PI*2 + t*1.45;
      const x=Math.sin(phase)*Math.min(240,105+n*13);
      const y=Math.sin(phase*2)*Math.min(105,42+n*6);
      const rot=Math.sin(phase)*10;
      const scale=1+.05*Math.sin(phase*2+t*2);
      w.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),0) rotate(${rot}deg) scale(${scale})`;
    });
  }
  if(scene==='fly'){
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const drift=Math.sin(t*1.7+i*.8)*4;
      const sway=Math.cos(t*1.15+i*.55)*2.5;
      const idleX=Math.sin(t*5.4+i*.9)*1.8;
      const idleY=Math.cos(t*5.4+i*1.1)*1.4;
      const idleR=Math.sin(t*5.4+i)*.75;
      w.style.translate=`${sway+idleX}px ${drift+idleY}px`;
      w.style.rotate=`${Math.sin(t*1.25+i)*2.2+idleR}deg`;
      w.style.scale=`${1+0.012*Math.sin(t*5.4+i)}`;
    });
  }
  if(scene==='flip'){
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const bob=Math.sin(t*3.2+i*.7)*2.5;
      const tilt=Math.sin(t*2.1+i)*1.5;
      const idleX=Math.sin(t*5.4+i*.9)*1.8;
      const idleY=Math.cos(t*5.4+i*1.1)*1.4;
      const idleR=Math.sin(t*5.4+i)*.75;
      w.style.translate=`${idleX}px ${bob+idleY}px`;
      w.style.rotate=`${tilt+idleR}deg`;
      w.style.scale=`${1+0.012*Math.sin(t*5.4+i)}`;
    });
  }
  if(scene==='rubber'){
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const s=1+.055*Math.sin(t*4+i*.9);
      const sx=s*(1+.12*Math.sin(t*2.3+i));
      const sy=s*(1-.08*Math.sin(t*2.3+i));
      w.style.transform=`scaleX(${sx}) scaleY(${sy}) rotate(${Math.sin(t*2+i)*1.5}deg)`;
    });
  }
  if(scene==='question'){
    const oo=words[0];
    if(oo) oo.style.transform=`translateY(${Math.sin(t*7)*3}px) scale(${1.02+.035*Math.max(0,Math.sin(t*4))})`;
  }

  /* 01:16 — KAHIT / MALAYO / PA YAN.
     Each foreground word gets its own energetic bob. */
  if(scene==='malayo-echo'){
    const cues=item.cues||[];
    words.forEach((w,i)=>{
      const cue=cues[i] ?? item.start;
      const nextCue=cues[i+1] ?? item.end;
      const fadeIn=.16;
      const fadeOut=.18;

      if(t<cue){
        w.style.opacity='0';
        w.style.transform='translate3d(0,18px,0) scale(.94)';
        w.style.filter='none';
        return;
      }

      const inP=Math.min(1,(t-cue)/fadeIn);
      const outP=Math.min(1,(nextCue-t)/fadeOut);
      const easeIn=inP*inP*(3-2*inP);
      const easeOut=outP*outP*(3-2*outP);
      const alpha=Math.min(easeIn,easeOut);

      const phase=t*(7.8+i*.72)+i*1.65;
      const x=Math.sin(phase)*4.5;
      const y=Math.cos(phase*1.12)*7.5;
      const r=Math.sin(phase*.86+i)*1.7;
      const scale=1+.028*Math.sin(phase*1.18);

      w.style.opacity=String(alpha);
      w.style.transform=`translate3d(${x}px,${y}px,0) rotate(${r}deg) scale(${scale})`;
      w.style.filter='none';
      w.style.zIndex='5';
    });
  }

  // Extra idle heartbeat for every scene, layered through independent transform properties.
  words.forEach((w,i)=>{
    if(!w.classList.contains('visible'))return;
    // The Bibigay stack has its own motion rules: keep the generic idle
    // heartbeat from adding movement to every word. Only "oras" is animated.
    if(el.querySelector('.clock-lyric.bibigay-static')){
      w.style.translate='0 0';
      w.style.rotate='0deg';
      w.style.scale='1';
      return;
    }
    if(scene==='fly' || scene==='flip' || scene==='orbit' || scene==='pupuntahan' || scene==='malayo-echo')return; // scene owns its transform
    const idleX=Math.sin(t*5.4+i*.9)*1.8;
    const idleY=Math.cos(t*5.4+i*1.1)*1.4;
    const idleR=Math.sin(t*5.4+i)*.75;
    w.style.translate=`${idleX}px ${idleY}px`;
    w.style.rotate=`${idleR}deg`;
    w.style.scale=`${1+0.012*Math.sin(t*5.4+i)}`;
  });

  /* 01:11 — "Ikaw ay lagi kong pupuntahan"
     New scene: each word owns the center one at a time. It fades/bobs in,
     stays energetic for its cue window, then fades/bobs out as the next word appears. */
  if(scene==='pupuntahan'){
    words.forEach((w,i)=>{
      const cue=item.cues?.[i] ?? item.start;
      const nextCue=item.cues?.[i+1] ?? item.end;
      const fadeIn=.12;
      const fadeOut=.12;

      if(t<cue || t>=nextCue){
        w.classList.remove('pupuntahan-show');
        w.style.opacity='0';
        w.style.transform='translate3d(-50%,-50%,0) scale(.94)';
        return;
      }

      const elapsed=t-cue;
      const remaining=nextCue-t;
      const inP=Math.min(1,elapsed/fadeIn);
      const outP=Math.min(1,remaining/fadeOut);
      const easeIn=inP*inP*(3-2*inP);
      const easeOut=outP*outP*(3-2*outP);
      const alpha=Math.min(easeIn,easeOut);

      // Energetic bob, but no orbit: each word gets its own lively motion.
      const phase=t*(9.5+i*.45)+i*1.3;
      const x=Math.sin(phase)*5.5;
      const y=Math.cos(phase*1.18)*8;
      const r=Math.sin(phase*.9)*2.8;
      const scale=(.94+.06*easeIn)*(1+.04*Math.sin(phase*1.25));

      w.style.opacity=String(alpha);
      w.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),0) rotate(${r}deg) scale(${scale})`;
      w.style.translate='0 0';
      w.style.rotate='0deg';
      w.style.scale='1';
      w.style.filter='none';
      w.style.zIndex='5';
      w.classList.add('pupuntahan-show');
    });
  }

  // First chorus owns its motion at the LINE level only. Clear all generic
  // per-word idle transforms so no individual word can shake during the pulse.
  if(current===4){
    words.forEach(w=>{
      if(!w.classList.contains('visible'))return;
      w.style.translate='0 0';
      w.style.rotate='0deg';
      w.style.scale='1';
    });
  }

  // Make the 1:03 "Pwede..." line physically bob more than the normal idle motion.
  if(current===8){
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const phase=t*7.2+i*.85;
      w.style.translate=`${Math.sin(phase)*4.2}px ${Math.cos(phase*1.08)*5.5}px`;
      w.style.rotate=`${Math.sin(phase*.92)*2.4}deg`;
      w.style.scale=(i===3 ? '1' : `${1+0.025*Math.sin(phase*1.15)}`);
    });
  }
}

function pulse(t){
  const beat=60/123.046875;
  const idx=Math.floor((t-0.197)/beat);
  if(idx>lastBeat&&idx>=0){
    lastBeat=idx;
    APP.classList.add('beat');
    FLASH.classList.add('hit');
    setTimeout(()=>APP.classList.remove('beat'),90);
    setTimeout(()=>FLASH.classList.remove('hit'),150);
    if(idx%8===0)echo();
  }
}

function echo(){
  const e=document.createElement('div');
  e.className='echo show';
  e.textContent=['LIGAWAN?','OO O HINDI?','GUSTO KITA','PUSO MO'][Math.floor(Math.random()*4)];
  e.style.left=(10+Math.random()*70)+'%';
  e.style.top=(20+Math.random()*60)+'%';
  e.style.fontSize=(20+Math.random()*80)+'px';
  e.style.setProperty('--dx',(Math.random()*180-90)+'px');
  e.style.setProperty('--dy',(Math.random()*180-90)+'px');
  e.style.setProperty('--r',(Math.random()*18-9)+'deg');
  E.appendChild(e);
  setTimeout(()=>e.remove(),1200);
}


let linyahanFootstepsActive=false;
let linyahanFootstepsTimer=null;

function clearLinyahanFootsteps(){
  const field=document.querySelector('.linyahan-footsteps');
  if(field) field.remove();
  if(linyahanFootstepsTimer) clearTimeout(linyahanFootstepsTimer);
  linyahanFootstepsTimer=null;
  linyahanFootstepsActive=false;
}

function spawnLinyahanFootsteps(){
  if(linyahanFootstepsActive)return;
  const el=L.querySelector('.line.active');
  if(!el || current!==5)return;

  linyahanFootstepsActive=true;

  const field=document.createElement('div');
  field.className='linyahan-footsteps';
  field.setAttribute('aria-hidden','true');
  el.appendChild(field);

  // Each stroke crosses the whole viewport, like a sequence of footsteps
  // travelling from one side to the other. Angles alternate to make the
  // trails feel like directional marks rather than parallel UI lines.
  const paths=[
    {y:'22%',angle:'-8deg',w:'38vw',d:'2.10s',delay:'0s',cls:'long'},
    {y:'38%',angle:'5deg', w:'29vw',d:'1.90s',delay:'.28s',cls:'short'},
    {y:'53%',angle:'-4deg',w:'44vw',d:'2.25s',delay:'.55s',cls:'long'},
    {y:'68%',angle:'7deg', w:'31vw',d:'2.00s',delay:'.82s',cls:'short'},
    {y:'81%',angle:'-6deg',w:'36vw',d:'2.15s',delay:'1.10s',cls:'long'}
  ];

  paths.forEach((p,i)=>{
    const dash=document.createElement('i');
    dash.className='linyahan-footstep '+p.cls;
    dash.style.setProperty('--start-x', i%2 ? '108vw' : '-46vw');
    dash.style.setProperty('--start-y',p.y);
    dash.style.setProperty('--angle',p.angle);
    dash.style.setProperty('--trail-w',p.w);
    dash.style.setProperty('--duration',p.d);
    dash.style.setProperty('--delay',p.delay);
    // Reverse the travel direction for alternating strokes.
    if(i%2){
      dash.style.animationName='linyahanFootstepReverse';
    }
    field.appendChild(dash);
  });

  linyahanFootstepsTimer=setTimeout(()=>{
    clearLinyahanFootsteps();
  },3600);
}

function updateSpecialVisuals(t){
  updateLaserHeart(t);
function updateLaserHeart(t){
  const el=L.querySelector('.line.active');
  if(!el || current!==4){
    return;
  }
  const svg=el.querySelector('.scene-laser-heart');
  const path=svg?.querySelector('.laser-heart-path');
  if(!svg || !path)return;

  const start=42.78;      // begins just after "ligawan" is spoken
  const drawEnd=45.62;    // slow laser trace
  const fadeEnd=46.05;    // then the laser disappears
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  if(t<start || t>=fadeEnd){
    svg.style.opacity='0';
    path.style.strokeDashoffset=svg.dataset.pathLength||path.getTotalLength();
    return;
  }

  const length=Number(svg.dataset.pathLength)||path.getTotalLength();
  const drawP=clamp((t-start)/(drawEnd-start),0,1);
  const eased=drawP*drawP*(3-2*drawP);
  path.style.strokeDashoffset=String(length*(1-eased));

  const fadeP=clamp((t-drawEnd)/(fadeEnd-drawEnd),0,1);
  svg.style.opacity=String(1-fadeP);
}

  // 00:46.80 linyahan: clean one-second fade ending exactly as the next line enters.
  // No separate pulse is allowed to overlap this fade.
  if(current===5){
    const linyahanLine=L.querySelector('.line.active.first-linyahan-vertical');
    const fadeStart=52.80, fadeEnd=53.80;
    if(linyahanLine && t>=fadeStart && t<fadeEnd){
      linyahanLine.classList.remove('linyahan-transition-pulse');
      linyahanLine.classList.add('linyahan-transition-fade');
    }else if(linyahanLine && t<fadeStart){
      linyahanLine.classList.remove('linyahan-transition-pulse','linyahan-transition-fade');
    }
  }

  // "linyahan" cue: crossing dashed trails, like fast footsteps.
  if(current===5 && t>=49.50 && t<51.35){
    if(!linyahanFootstepsActive) spawnLinyahanFootsteps();
  }else if(linyahanFootstepsActive){
    clearLinyahanFootsteps();
  }

  const firstWasActive = current===0;
  if(firstWasActive && t>=11.680 && t<12.430 && !window._pusoHeartBurst){
    window._pusoHeartBurst=true;
    spawnPusoHearts();
  }
  if(!firstWasActive) window._pusoHeartBurst=false;

  // The requested echo occurs during 00:21–00:23 (21.0–23.0s).
  const inBanatEcho=(t>=21 && t<23.5);
  if(inBanatEcho && !window._banatEchoStarted){
    window._banatEchoStarted=true;
    spawnBanatEcho();
    setTimeout(spawnBanatEcho,420);
    setTimeout(spawnBanatEcho,900);
  }
  if(!inBanatEcho) window._banatEchoStarted=false;

  // First-chorus transition beat: pulse at 00:44, then dissolve into the next line.
  if(current===4){
    const qLine=L.querySelector('.line.active.question-chaos');
    const pulseStart=44.00;
    const pulseEnd=44.52;
    const fadeStart=45.80;
    const fadeEnd=46.80;
    if(qLine && t>=pulseStart && t<pulseEnd){
      qLine.classList.remove('question-chorus-fade');
      qLine.classList.add('question-chorus-pulse');
    }else if(qLine && t>=fadeStart && t<fadeEnd){
      qLine.classList.remove('question-chorus-pulse');
      qLine.classList.add('question-chorus-fade');
    }else if(qLine && t< pulseStart){
      qLine.classList.remove('question-chorus-pulse','question-chorus-fade');
    }
  }

  // 01:08 "Oo o hindi?": begin pulsing ONLY the actual "Oo" word
  // immediately after "hindi" and keep it pulsing until this lyric disappears.
  if(current===9){
    const qLine=L.querySelector('.line.active.scene-question');
    const pulseStart=68.56;
    const lineEnd=71.00;
    if(qLine && t>=pulseStart && t<lineEnd){
      qLine.classList.add('oo-final-pulse');
    }else if(qLine && t< pulseStart){
      qLine.classList.remove('oo-final-pulse');
    }else if(qLine && t>=lineEnd){
      qLine.classList.remove('oo-final-pulse');
    }
  }
}
