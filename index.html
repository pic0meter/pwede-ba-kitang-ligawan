function spawnClockNumberBackgroundBurst(wordIndex, opts={}){
  // Single clock-number burst system. Numbers are anchored to the spoken word,
  // layered between the clock and lyric, small, thin, quick, and immediately fading.
  const line=L.querySelector('.line.active.scene-clock');
  const word=line?.querySelector('.clock-lyric .word[data-word-index="'+wordIndex+'"]');
  const wrap=line?.querySelector('.clock-wrap');
  if(!line||!word||!wrap)return;

  const field=wrap.querySelector('.clock-number-burst-layer');
  if(!field)return;

  const rect=word.getBoundingClientRect();
  const base=field.getBoundingClientRect();
  const cx=rect.left+rect.width/2-base.left;
  const cy=rect.top+rect.height/2-base.top;
  const elevated=!!opts.elevated;
  const count=5;
  const group=String(Date.now())+'-'+Math.random();

  for(let n=0;n<count;n++){
    const e=document.createElement('span');
    e.className='clock-number-bg-burst';
    e.dataset.burstGroup=group;
    e.textContent=String(1+Math.floor(Math.random()*12));
    e.style.left=cx+'px';
    e.style.top=cy+'px';

    // Keep every burst small. Elevated words are only slightly larger.
    e.style.fontSize=(elevated ? 58+Math.random()*24 : 48+Math.random()*22)+'px';
    e.style.fontWeight='500';
    e.style.color=(n%2===0 ? '#ffb38a' : '#f8f0e6');
    e.style.setProperty('--alpha',(0.48+Math.random()*0.18).toFixed(3));
    e.style.setProperty('--life',(1.05+Math.random()*0.25).toFixed(2)+'s');
    e.style.setProperty('--scale',(1.05+Math.random()*0.42).toFixed(2));
    e.style.setProperty('--r',(-8+Math.random()*16)+'deg');
    e.style.setProperty('--r2',(-14+Math.random()*28)+'deg');

    if(elevated){
      // Magaling / ako: burst around the word in all directions, not upward.
      const angle=(Math.PI*2/count)*n+(Math.random()-.5)*.5;
      const distance=105+Math.random()*75;
      e.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');
      e.style.setProperty('--dy',(Math.sin(angle)*distance)+'px');
    }else{
      // Other clock words: compact radial burst.
      const angle=(Math.PI*2/count)*n+(Math.random()-.5)*.45;
      const distance=85+Math.random()*65;
      e.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');
      e.style.setProperty('--dy',(Math.sin(angle)*distance)+'px');
    }
    field.appendChild(e);
  }

  setTimeout(()=>{
    field.querySelectorAll('.clock-number-bg-burst').forEach(e=>{
      if(e.dataset.burstGroup===group)e.remove();
    });
  },1100);
}

function render(){
  if((A.currentTime||0)>=135){A.currentTime=135;A.pause();}
  const t=Math.min(A.currentTime||0,135);
  const i=lines.findIndex(x=>t>=x.start&&t<x.end);
  activate(i);

  // Keep the GUSTO line completely clean of the old square/confetti decoration.
  APP.classList.toggle('gusto-clean', i===3);
  if(i===3){
    ['heartField','backgroundBanat','echoes','siteSparkField'].forEach(id=>{
      const field=document.getElementById(id);
      if(field) field.replaceChildren();
    });
  }

  // Time-locked visual effects:
  // PUSO burst only during the PUSO cue (11.680s–12.430s).
  if(t>=11.680 && t<15.85){
    // Keep the soft background hearts alive and moving through the whole line.
    spawnPusoBackground();
    // The "puso" hearts stay visible until the "mo?" cue.
    if(t<12.430 && !pusoBurstActive) spawnPusoHearts();
    // The first heart pop follows the original "puso" cue, then "mo?" gets its own pop.
    if(t>=12.430 && !moBurstActive) spawnMoHearts();
    // Second wave: a renewed "puso" burst at 00:14, followed by another "mo?" burst.
    if(t>=14.000 && !pusoSecondBurstActive) spawnPusoSecondHearts();
    if(t>=14.700 && !moSecondBurstActive) spawnMoSecondHearts();
  }else{
    if(pusoBurstActive) clearPusoHearts();
    if(moBurstActive) clearMoHearts();
    if(pusoBgActive) clearPusoBackground();
  }


  // The GUSTO line gets subtle background word explosions as each highlighted
  // word arrives. They use the same expanding-copy language as the full-screen
  // Oo effect, but stay behind the lyric and at much lower opacity.
  if(i===3){
    const burstCues=[
      [1,32.18],[3,32.72],[5,33.15],[7,35.48]
    ];
    burstCues.forEach(([wordIndex,cue])=>{
      const key=String(wordIndex);
      if(t>=cue && t<cue+0.12 && !wordBackgroundBursts.includes(key)){
        wordBackgroundBursts.push(key);
        spawnWordBackgroundBurst(wordIndex);
      }
    });
  }else if(i===6 || i===18){
    // No number bursts on this lyric.
  }else if(i===7){
    // Same one-second delay for the next line. Magaling/ako burst around
    // the word in all directions, with the same three-number limit.
    const burstCues=[
      [0,59.78,false],   // Kasi — +80ms
      [2,60.56,false],   // alam — +80ms
      [4,61.38,true],    // magaling — +80ms
      [5,61.80,true]     // ako — +80ms
    ];
    burstCues.forEach(([wordIndex,cue,elevated])=>{
      const key='7-'+wordIndex;
      if(t>=cue && t<cue+0.07 && !clockNumberBackgroundBursts.includes(key)){
        clockNumberBackgroundBursts.push(key);
        spawnClockNumberBackgroundBurst(wordIndex,{elevated});
      }
    });
  }else{ 
    if(wordBackgroundBursts.length)clearWordBackgroundBursts();
    clockNumberBackgroundBursts=[];
  }

  // GUSTO's final 'oo' gets ONE full-screen Oo-only burst at its cue.
  // No second wipe, hearts, diamonds, or confetti: the screen is filled only by 'Oo'.
  if(i===3 && t>=36.42 && t<39.25){
    if(!ooTakeoverActive) spawnOoTakeover();
  }else if(i!==3 && (ooTakeoverActive||ooHeartBurstActive)){
    clearOoTakeover();
  }

  // "banat na 'to" exists ONLY from 00:21.000 through 00:23.499.
  // Clear first so seeking backward/forward can never leave stale echoes.
  if(t>=21 && t<23.5){
    if(!banatEchoActive) spawnBanatEchoes();
  }else{
    clearBanatEchoes();
  }

  updateWords(t);
  updateMotion(t);
  if(current===4){
    const qf=document.getElementById('questionChaos');
    if(qf){
      const ready=t>=39.65 && t<46.75;
      qf.classList.toggle('ready',ready);
      qf.classList.remove('leaving');
    }
  }

  updateClock(t);
  pulse(t);
const d=Math.min(A.duration||135,135);
  P.style.width=Math.min(100,(t/d)*100)+'%';
  T.textContent=fmt(t);
  C.textContent=fmt(t)+' / '+fmt(d);

  const beatPhase=((t-0.197)/(60/123.046875))%1;
  const breathe=1+Math.max(0,1-Math.abs(beatPhase-.5)*2)*.022;
  O1.style.transform=`translate(var(--mx),var(--my)) scale(${breathe})`;
  O2.style.transform=`translate(calc(var(--mx) * -.6),calc(var(--my) * -.6)) scale(${1+(breathe-.978)*2})`;
  document.documentElement.style.setProperty('--x',(50+Math.sin(t*.7)*12)+'%');
  document.documentElement.style.setProperty('--y',(50+Math.cos(t*.53)*10)+'%');

  raf=requestAnimationFrame(render);
}

async function play(){
  try{
    await A.play();
  }catch(err){
    console.error('Audio playback failed:',err);
    TOGGLE.textContent='▶';
    document.querySelector('#hint .play').textContent='Tap again to play';
  }
}
function pause(){A.pause()}

A.addEventListener('play',()=>{
  playing=true;APP.classList.add('playing');TOGGLE.textContent='❚❚';
});
A.addEventListener('pause',()=>{
  playing=false;APP.classList.remove('playing');TOGGLE.textContent='▶';
});
A.addEventListener('ended',()=>{
  playing=false;APP.classList.remove('playing');TOGGLE.textContent='▶';
  lastBeat=-1;current=-1;activate(-1);
});
A.addEventListener('loadedmetadata',()=>{
  C.textContent='00:00 / '+fmt(Math.min(A.duration||135,135));
});

function seekFromClientX(x){
  if(!A.duration)return;
  const r=TRACK.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(x-r.left)/r.width));
  A.currentTime=ratio*A.duration;
  SCRUB.textContent=fmt(A.currentTime);
}
TRACK.addEventListener('pointerdown',e=>{
  scrubbing=true;APP.classList.add('scrubbing');
  TRACK.setPointerCapture?.(e.pointerId);
  seekFromClientX(e.clientX);
});
TRACK.addEventListener('pointermove',e=>{
  if(scrubbing)seekFromClientX(e.clientX);
});
TRACK.addEventListener('pointerup',e=>{
  scrubbing=false;APP.classList.remove('scrubbing');
  seekFromClientX(e.clientX);
});
TRACK.addEventListener('pointercancel',()=>{
  scrubbing=false;APP.classList.remove('scrubbing');
});

document.querySelector('#start').addEventListener('click',play);
TOGGLE.addEventListener('click',()=>A.paused?play():pause());

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();A.paused?play():pause();}
  if(e.code==='ArrowRight')A.currentTime=Math.min(A.duration||135,135,A.currentTime+5);
  if(e.code==='ArrowLeft')A.currentTime=Math.max(0,A.currentTime-5);
});

APP.addEventListener('pointermove',e=>{
  const x=(e.clientX/innerWidth-.5)*14;
  const y=(e.clientY/innerHeight-.5)*14;
  document.documentElement.style.setProperty('--mx',x+'px');
  document.documentElement.style.setProperty('--my',y+'px');
});
APP.addEventListener('pointerleave',()=>{
  document.documentElement.style.setProperty('--mx','0px');
  document.documentElement.style.setProperty('--my','0px');
});
render();
</script>
