<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b0a">
<title>Pwede Ba Kitang Ligawan — Kinetic Lyrics</title>
<style>
:root{
  --bg:#0d0b0a;--ink:#f8f0e6;--muted:#b6a99c;--accent:#ffb38a;
  --x:50%;--y:50%;--mx:0px;--my:0px;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);
  overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#app{
  position:relative;width:100vw;height:100dvh;overflow:hidden;
  background:
    radial-gradient(circle at var(--x) var(--y),#33241d 0,#171210 30%,#0d0b0a 70%);
  isolation:isolate;
}
#grain{
  position:absolute;inset:-50%;opacity:.055;pointer-events:none;z-index:30;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation:grain .18s steps(2) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}
  50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}
.ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{
  position:absolute;border-radius:50%;filter:blur(70px);opacity:.18;
  transition:transform .15s ease;will-change:transform;
}
.o1{width:38vw;height:38vw;background:#a75d3d;left:-12vw;top:10vh}
.o2{width:28vw;height:28vw;background:#70583c;right:-8vw;bottom:-6vh}

#top{
  position:absolute;left:4vw;right:4vw;top:3.5vh;display:flex;
  justify-content:space-between;align-items:center;z-index:10;
  font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#cfc1b4;
}
.title{display:flex;gap:10px;align-items:center}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 18px #ffb38a99;transition:transform .25s ease;
}
.playing .dot{transform:scale(1.45)}
.counter{opacity:.75}

#stage{
  position:absolute;inset:0;display:grid;place-items:center;
  padding:10vh 7vw 17vh;z-index:4;
}
.lyric{
  position:relative;width:min(1100px,90vw);height:min(48vh,430px);
  display:flex;align-items:center;justify-content:center;
}
.line{
  position:absolute;max-width:100%;text-align:center;
  opacity:0;transform:translateY(25px) scale(.965);
  filter:blur(8px);pointer-events:none;
  transition:
    opacity .32s ease,
    transform .65s cubic-bezier(.2,.8,.2,1),
    filter .45s ease;
  will-change:transform,opacity,filter;
}
.line.active{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
.line.out{
  opacity:0;transform:translateY(-35px) scale(1.035);filter:blur(6px);
}
.line.verse{
  font-size:clamp(28px,4.4vw,68px);font-weight:600;
  letter-spacing:-.045em;line-height:1.05;
}
.line.soft{
  font-size:clamp(25px,3.7vw,58px);font-weight:400;
  letter-spacing:-.04em;line-height:1.08;
}
.line.chorus{
  font-size:clamp(45px,8.7vw,132px);font-weight:800;
  letter-spacing:-.075em;line-height:.88;
}
.line.big{
  font-size:clamp(56px,11vw,170px);font-weight:800;
  letter-spacing:-.085em;line-height:.8;
}
.word{
  display:inline-block;margin:.03em .105em;
  opacity:.08;transform:translateY(.38em) scale(.94);
  filter:blur(5px);color:#d9cec4;
  transition:
    opacity .16s ease,
    transform .22s cubic-bezier(.2,.8,.2,1),
    filter .2s ease,color .2s ease,text-shadow .2s ease;
  will-change:transform,opacity,filter;
}
.word.visible{
  opacity:1;transform:translateY(0) scale(1);filter:blur(0);color:var(--ink);
}
.word.current{
  color:var(--accent);transform:translateY(-.055em) scale(1.06);
  text-shadow:0 0 28px #ffb38a55;
}
.word.accent,.word.visible.accent{color:var(--accent)}


#ooExplosion{position:absolute;inset:0;z-index:8;overflow:hidden;pointer-events:none}
.oo-field{position:absolute;left:50%;top:50%;white-space:nowrap;font-weight:900;letter-spacing:-.08em;color:#f8f0e6;opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(var(--r));animation:ooTakeover var(--life) cubic-bezier(.12,.8,.18,1) forwards;text-shadow:0 0 24px #ffb38a33}
@keyframes ooTakeover{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(var(--r))}12%{opacity:.92}48%{opacity:.82}78%{opacity:.88}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--r2))}}
.oo-field.wipe{animation:ooWipe 1.15s cubic-bezier(.12,.75,.18,1) forwards}
@keyframes ooWipe{0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}18%{opacity:.95;transform:translate(-50%,-50%) scale(.8)}50%{opacity:.9;transform:translate(-50%,-50%) scale(2.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
.oo-heart{position:absolute;width:var(--size);height:var(--size);left:50%;top:50%;background:currentColor;opacity:0;rotate:-45deg;border-radius:2px;animation:ooHeartBurst var(--life) cubic-bezier(.12,.75,.18,1) forwards}
.oo-heart::before,.oo-heart::after{content:"";position:absolute;width:50%;height:50%;border-radius:50%;background:currentColor}.oo-heart::before{left:0;top:0}.oo-heart::after{right:0;top:0}
@keyframes ooHeartBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}10%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot))}}


.puso-throb .word{animation:lyricThrob .72s ease-in-out infinite}.puso-throb .word.current{animation:lyricThrobCurrent .48s ease-in-out infinite}
@keyframes lyricThrob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.025)}}
@keyframes lyricThrobCurrent{0%,100%{transform:translateY(-.055em) scale(1.06)}50%{transform:translateY(-.09em) scale(1.13)}}
.puso-bg-heart{position:absolute;width:var(--size);height:var(--size);left:var(--x);top:var(--y);background:currentColor;opacity:0;rotate:-45deg;border-radius:2px;animation:pusoBgPulse var(--life) ease-in-out infinite}
.puso-bg-heart::before,.puso-bg-heart::after{content:"";position:absolute;width:50%;height:50%;border-radius:50%;background:currentColor}.puso-bg-heart::before{left:0;top:0}.puso-bg-heart::after{right:0;top:0}
@keyframes pusoBgPulse{0%,100%{opacity:.035;transform:scale(.88)}50%{opacity:.16;transform:scale(1.12)}}

/* PUSO heart burst — exists only while the PUSO cue is active */
#heartField{
  position:absolute;
  inset:0;
  z-index:6;
  overflow:hidden;
  pointer-events:none;
}
.puso-heart{
  position:absolute;
  left:0;
  top:0;
  width:auto;
  height:auto;
  color:#ffb38a;
  font-size:var(--size);
  line-height:1;
  opacity:0;
  text-shadow:0 0 14px #ffb38a66;
  transform:translate(-50%,-50%) scale(.25);
  animation:pusoHeartBurst var(--life) cubic-bezier(.18,.72,.25,1) forwards;
  will-change:transform,opacity;
}
@keyframes pusoHeartBurst{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.25) rotate(0deg);
  }
  12%{opacity:.95}
  72%{opacity:.72}
  100%{
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1)
      rotate(var(--rot));
  }
}

/* "banat na 'to" echo field — only visible during 00:21–00:23 */
#backgroundBanat{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;opacity:1}
.banat-echo{
  position:absolute;
  white-space:nowrap;
  color:#fff;
  opacity:0;
  font-weight:800;
  letter-spacing:-.06em;
  mix-blend-mode:screen;
  animation:banatEchoInOut var(--life,1.9s) ease-out forwards;
}
@keyframes banatEchoInOut{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.78) rotate(var(--rot));
  }
  15%{opacity:var(--alpha)}
  68%{opacity:calc(var(--alpha) * .72)}
  100%{
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1.08)
      rotate(var(--rot));
  }
}

#echoes{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.echo{
  position:absolute;font-weight:800;white-space:nowrap;color:#fff;opacity:0;
  mix-blend-mode:screen;letter-spacing:-.08em;filter:blur(.2px);
}
.echo.show{animation:echo 1.15s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes echo{
  0%{opacity:0;transform:translate(0,0) scale(.65) rotate(var(--r))}
  18%{opacity:.08}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r))}
}

#hint{
  position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);
  z-index:11;text-align:center;color:#c8bdb3;
  font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.14em;text-transform:uppercase;transition:opacity .5s;
}
.playing #hint{opacity:0;pointer-events:none}
.play{
  border:1px solid #ffffff35;background:#ffffff08;
  backdrop-filter:blur(10px);border-radius:999px;padding:12px 20px;
  cursor:pointer;transition:.2s;
}
.play:hover{background:#ffffff14;transform:translateY(-1px)}

#controls{
  position:absolute;left:4vw;right:4vw;bottom:4.5vh;z-index:12;
  display:flex;align-items:center;gap:15px;
}
.ctrl{
  width:42px;height:42px;border:1px solid #ffffff2d;background:#ffffff09;
  border-radius:50%;cursor:pointer;flex:0 0 auto;transition:.18s;
}
.ctrl:hover{background:#ffffff15;transform:scale(1.04)}
.track{
  height:5px;background:#ffffff20;flex:1;position:relative;
  cursor:pointer;border-radius:99px;touch-action:none;
}
.progress{
  position:absolute;left:0;top:0;height:100%;width:0;
  background:var(--accent);box-shadow:0 0 14px #ffb38a77;border-radius:99px;
}
.track::before{
  content:"";position:absolute;inset:-10px 0; /* larger touch target */
}
.time{
  font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#bcaea1;min-width:88px;text-align:right;
}
#section{
  position:absolute;right:4vw;top:50%;
  transform:translateY(-50%) rotate(90deg);transform-origin:right center;
  color:#8f8379;font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.2em;text-transform:uppercase;z-index:10;
}
.flash{
  position:absolute;inset:0;background:#fff;opacity:0;z-index:9;pointer-events:none;
}
.flash.hit{animation:flash .14s ease-out}
@keyframes flash{0%{opacity:.11}100%{opacity:0}}

#scrubLabel{
  position:absolute;bottom:calc(4.5vh + 54px);right:4vw;z-index:13;
  opacity:0;transform:translateY(5px);pointer-events:none;
  padding:5px 8px;border:1px solid #ffffff18;border-radius:7px;
  background:#0d0b0add;backdrop-filter:blur(8px);
  font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfc1b4;
  transition:.15s;
}
.scrubbing #scrubLabel{opacity:1;transform:translateY(0)}


/* playful / makulit typography */
.line.active .word.visible:not(.current){animation:wordPop .42s cubic-bezier(.18,.9,.25,1.35) both}
.line.chorus.active .word.visible{animation:chorusPop .5s cubic-bezier(.16,1,.3,1.15) both}
.line.big.active .word.visible{animation:bigBounce .55s cubic-bezier(.15,1.2,.25,1) both}
.word.stretch{letter-spacing:.015em;transform-origin:left center}
.line.active .word.stretch.visible{animation:stretchWiggle .8s cubic-bezier(.2,.9,.25,1.15) both}
.question-mark{display:inline-block;margin-left:.03em;opacity:0;transform:translateY(.3em) rotate(-8deg) scale(.8);color:var(--accent);transition:.28s cubic-bezier(.2,.9,.2,1)}
.question-mark.visible{opacity:1;transform:translateY(-.02em) rotate(8deg) scale(1.08);animation:qBounce .5s ease-out both}
.word.deny{position:relative}
.word.deny.crossed{color:#cbbfb5;transform:translateY(.02em) rotate(-2deg) scale(1)}
.word.deny.crossed::after{content:"";position:absolute;left:-.08em;right:-.08em;top:52%;height:.075em;background:var(--accent);box-shadow:0 0 10px #ffb38a55;transform:rotate(-7deg) scaleX(0);transform-origin:left center;animation:crossOut .35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wordPop{0%{transform:translateY(.3em) scale(.86) rotate(var(--tilt,0deg));opacity:.15}55%{transform:translateY(-.07em) scale(1.055) rotate(calc(var(--tilt,0deg) * -1));opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes chorusPop{0%{transform:translateY(.22em) scale(.72) rotate(-5deg);opacity:.05}60%{transform:translateY(-.08em) scale(1.12) rotate(2deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes bigBounce{0%{transform:translateY(.4em) scale(.65) rotate(-4deg);opacity:0}58%{transform:translateY(-.09em) scale(1.13) rotate(2deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes stretchWiggle{0%{transform:translateY(.25em) scaleX(.7);opacity:.15}35%{transform:translateY(-.08em) scaleX(1.08) rotate(-1deg);opacity:1}65%{transform:translateY(.025em) scaleX(1.18) rotate(1deg)}100%{transform:translateY(0) scaleX(1.08) rotate(0);opacity:1}}
@keyframes qBounce{0%{transform:translateY(.3em) rotate(-12deg) scale(.7)}60%{transform:translateY(-.08em) rotate(12deg) scale(1.15)}100%{transform:translateY(-.02em) rotate(8deg) scale(1.08)}}
@keyframes crossOut{to{transform:rotate(-7deg) scaleX(1)}}



/* --- EXTRA MOTION LANGUAGE: SLIT / SQUIGGLE / WIND / CLOCK --- */
.line.scene-slit{gap:.015em .11em;overflow:visible}
.line.scene-slit .word{clip-path:inset(0 0 0 0);}
.line.scene-slit .word.visible{animation:slitIn .62s cubic-bezier(.12,1.2,.25,1) both,slitFloat 2.4s ease-in-out .62s infinite alternate}
.line.scene-slit .word:nth-child(odd){--slit-x:-1}
.line.scene-slit .word:nth-child(even){--slit-x:1}
@keyframes slitIn{
  0%{opacity:0;transform:translateX(calc(var(--slit-x)*65px)) scaleX(.05);clip-path:inset(0 48% 0 48%);filter:blur(5px)}
  45%{opacity:1;transform:translateX(calc(var(--slit-x)*14px)) scaleX(1.12);clip-path:inset(0 0 0 0);filter:blur(0)}
  72%{transform:translateX(calc(var(--slit-x)*-5px)) scaleX(.96)}
  100%{opacity:1;transform:none}
}
@keyframes slitFloat{0%{transform:translateY(2px) rotate(-.8deg)}100%{transform:translateY(-4px) rotate(.8deg)}}

.line.scene-squiggle{gap:.02em .10em}
.line.scene-squiggle .word.visible{animation:squiggleIn .5s cubic-bezier(.15,1.3,.3,1) both,squiggleLoop 1.35s ease-in-out .5s infinite}
@keyframes squiggleIn{0%{opacity:0;transform:translateY(35px) rotate(-12deg) scale(.7)}65%{opacity:1;transform:translateY(-7px) rotate(8deg) scale(1.08)}100%{opacity:1;transform:none}}
@keyframes squiggleLoop{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(3px,-3px) rotate(3deg)}
  40%{transform:translate(-4px,4px) rotate(-4deg)}
  60%{transform:translate(4px,2px) rotate(3deg)}
  80%{transform:translate(-2px,-3px) rotate(-2deg)}
}

.line.scene-wind{gap:.015em .08em;perspective:900px}
.line.scene-wind .word.visible{animation:windIn .7s cubic-bezier(.12,1.15,.3,1) both,windDrift 3.1s ease-in-out .7s infinite alternate}
@keyframes windIn{0%{opacity:0;transform:translate3d(-90px,28px,0) rotate(-12deg) skewX(-12deg);filter:blur(8px)}55%{opacity:1;transform:translate3d(15px,-5px,20px) rotate(4deg) skewX(3deg);filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes windDrift{0%{transform:translate3d(-5px,2px,0) rotate(-1deg) skewX(-1deg)}100%{transform:translate3d(9px,-5px,0) rotate(2deg) skewX(2deg)}}


/* 9 — words fly in from every corner, then keep a tiny mid-air drift */
.line.scene-fly{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.02em .14em;perspective:1100px}
.line.scene-fly .word{animation:flyIn .72s cubic-bezier(.12,1.25,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.line.scene-fly .word:nth-child(3n+1){font-size:1.18em;transform-origin:center}
.line.scene-fly .word:nth-child(3n+2){font-size:.76em;letter-spacing:.10em}
.line.scene-fly .word:nth-child(4n){transform:scaleX(.72)}
@keyframes flyIn{0%{opacity:0;transform:translate3d(var(--fx),var(--fy),-500px) rotate(var(--fr)) scale(.35)}65%{opacity:1;transform:translate3d(0,0,40px) rotate(calc(var(--fr)*-.15)) scale(1.08)}100%{opacity:1;transform:translate3d(0,0,0) rotate(0) scale(1)}}
.line.scene-fly .word.visible{animation-name:flyIn,flyFloat;animation-duration:.72s,2.8s;animation-delay:calc(var(--i)*70ms),calc(.72s + var(--i)*70ms);animation-iteration-count:1,infinite;animation-direction:normal,alternate}
@keyframes flyFloat{from{translate:0 0;rotate:0deg}to{translate:0 -7px;rotate:1.5deg}}

/* 10 — words crawl along a loose figure-eight / snake path */
.line.scene-crawl{position:relative;width:min(88vw,760px);height:min(46vh,390px);display:block}
.line.scene-crawl .word{position:absolute;left:50%;top:50%;margin:0;white-space:nowrap;opacity:0}
.line.scene-crawl .word.visible{opacity:1;animation:crawlIn .5s cubic-bezier(.15,1.25,.3,1) both}
@keyframes crawlIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-30deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(5deg)}100%{opacity:1}}

/* 11 — words literally flip from one line to the next */
.line.scene-flip{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:.02em .12em;perspective:1000px;max-width:92vw}
.line.scene-flip .word{transform-style:preserve-3d;backface-visibility:hidden;animation:flipLine .78s cubic-bezier(.18,1.15,.25,1) both;animation-delay:calc(var(--i)*85ms)}
.line.scene-flip .word:nth-child(odd){font-size:1.16em}
.line.scene-flip .word:nth-child(even){font-size:.82em;transform:scaleX(.82)}
@keyframes flipLine{0%{opacity:0;transform:translateY(-1.15em) rotateX(-90deg) rotateZ(-8deg) scale(.8)}45%{opacity:1;transform:translateY(.25em) rotateX(55deg) rotateZ(3deg) scale(1.05)}75%{transform:translateY(-.08em) rotateX(-12deg) rotateZ(-1deg)}100%{opacity:1;transform:translateY(0) rotateX(0) rotateZ(0) scale(1)}}

/* 12 — typography gets intentionally stretched/squeezed like rubber */
.line.scene-rubber{display:flex;flex-wrap:wrap;justify-content:center;gap:.03em .08em}
.line.scene-rubber .word{animation:rubberIn .55s cubic-bezier(.15,1.35,.3,1) both;animation-delay:calc(var(--i)*55ms)}
.line.scene-rubber .word:nth-child(1){font-size:1.35em;transform:scaleX(.62)}
.line.scene-rubber .word:nth-child(2n){font-size:.74em;transform:scaleX(1.35)}
.line.scene-rubber .word:nth-child(3n){font-size:1.08em;transform:scaleX(.78)}
@keyframes rubberIn{0%{opacity:0;transform:scaleX(.1) scaleY(1.4) rotate(-6deg)}55%{opacity:1;transform:scaleX(1.18) scaleY(.88) rotate(2deg)}100%{opacity:1;transform:scaleX(1) scaleY(1) rotate(0)}}

/* continuous typography variety */
.line.motion .word:nth-child(5n+1){letter-spacing:.01em}
.line.motion .word:nth-child(5n+2){letter-spacing:.08em}
.line.motion .word:nth-child(5n+3){letter-spacing:-.035em}
.line.motion .word:nth-child(4n){font-size:.88em}
.line.motion .word:nth-child(7n+1){font-size:1.12em}

.clock-wrap{position:relative;width:min(92vw,700px);height:min(48vh,410px);display:grid;place-items:center}
.clock-face{position:absolute;width:min(78vw,350px);height:min(78vw,350px);border:1px solid #ffffff20;border-radius:50%;opacity:.8;box-shadow:0 0 45px #ffb38a0d inset,0 0 25px #ffb38a0b}
.clock-face::before{content:"";position:absolute;inset:8%;border:1px dashed #ffffff12;border-radius:50%}
.clock-number{position:absolute;left:50%;top:50%;font:700 clamp(9px,2.3vw,14px) ui-monospace,SFMono-Regular,Menlo,monospace;color:#a99d93;transform:translate(-50%,-50%);opacity:0;animation:clockNumberIn .45s cubic-bezier(.15,1.35,.3,1) forwards;animation-delay:calc(var(--n)*35ms)}
@keyframes clockNumberIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}100%{opacity:.85;transform:translate(-50%,-50%) scale(1) rotate(0)}}

/* --- PUSO / HEARTBEAT ENHANCEMENT --- */
.line.scene-heart-split{
  width:min(1120px,92vw);
  min-height:48vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

.line.scene-heart-split .lyric-part{

  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:.02em .13em;
  position:relative;
  width:100%;
  z-index:2;
}
.line.scene-heart-split .lyric-part.top{

}
.line.scene-heart-split .lyric-part.heart-line{

}
.line.scene-heart-split .word{z-index:2}

}
.line.scene-heart-split .heart-anchor .word{position:relative;z-index:3}
.heart-field{
  position:absolute;
  left:50%;
  top:50%;
  width:min(70vw,560px);
  height:150px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:1;
  overflow:visible;
}

  position:absolute;
  left:50%;
  top:55%;
  color:#ffb38a;

  45%{opacity:.78;transform:translate(calc(-50% + var(--hx1)),calc(-50% - 45px)) scale(.92) rotate(calc(var(--hr) + 5deg))}
  78%{opacity:.45;transform:translate(calc(-50% + var(--hx2)),calc(-50% - 95px)) scale(.76) rotate(calc(var(--hr) - 4deg))}
  100%{opacity:0;transform:translate(calc(-50% + var(--hx3)),calc(-50% - 145px)) scale(.45) rotate(calc(var(--hr) + 8deg))}
}
/* Stronger idle movement: the words subtly tremble between lyric cues. */
/* Idle heartbeat is applied in updateMotion() with independent CSS transform properties, so it never cancels a scene's entrance animation. */
.line.active .word.visible:not(.current){will-change:transform,translate,rotate,scale}

/* The synchronized music beat gives all idle words a second, sharper pulse. */
#app.beat .line.active .word.visible:not(.current){
  text-shadow:0 0 24px #ffb38a55;
  scale:1.045;
}
#app.beat .line.scene-heart-split .word.current{

  text-shadow:0 0 34px #ffb38a77;
}

/* --- PLAYFUL MOTION-GRAPHICS V2 --- */
#stage{perspective:1400px}
.lyric{perspective:1400px;transform-style:preserve-3d}
.line.motion{width:min(1120px,92vw);min-height:48vh;height:auto;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:.05em .12em;transform-style:preserve-3d;will-change:transform}
.line.motion .word{display:inline-block;position:relative;will-change:transform,opacity;backface-visibility:hidden}
/* kill the old generic entrance animation; every scene owns its choreography */
.line.motion.active .word.visible:not(.current),
.line.motion.chorus.active .word.visible,
.line.motion.big.active .word.visible,
.line.motion.active .word.stretch.visible{animation:none}

/* 1 — words chase one another along a little elastic path */
.line.scene-chase{gap:.02em .13em}
.line.scene-chase .word.visible{animation:chaseIn .48s cubic-bezier(.16,1.25,.28,1) both, chaseFloat 1.8s ease-in-out .48s infinite alternate}
@keyframes chaseIn{0%{opacity:0;transform:translate3d(-90px,35px,0) rotate(-12deg) scale(.55)}65%{opacity:1;transform:translate3d(12px,-10px,40px) rotate(5deg) scale(1.08)}100%{opacity:1;transform:none}}
@keyframes chaseFloat{0%{transform:translateY(2px) rotate(-1deg)}100%{transform:translateY(-5px) rotate(1deg)}}

/* 2 — awkward line: words arrive from different directions, then gently bump */
.line.scene-bump{gap:.04em .14em}
.line.scene-bump .word.visible{animation:bumpIn .52s cubic-bezier(.16,1.3,.28,1) both,bumpLoop 1.7s ease-in-out .52s infinite}
@keyframes bumpIn{0%{opacity:0;transform:translate3d(var(--sx),var(--sy),-120px) rotate(var(--sr)) scale(.55)}70%{opacity:1;transform:translate3d(0,-7px,30px) rotate(calc(var(--sr)*-.25)) scale(1.1)}100%{opacity:1;transform:none}}
@keyframes bumpLoop{0%,100%{transform:translate(0,0) rotate(0)}45%{transform:translate(var(--bx),var(--by)) rotate(var(--br))}60%{transform:translate(calc(var(--bx)*-.5),calc(var(--by)*-.5)) rotate(calc(var(--br)*-.5))}}

/* stronger shivering for Gusto */
.line.gusto-shiver .word.visible{animation:gustoShiverIn .45s cubic-bezier(.16,1.3,.28,1) both,gustoShiver .105s steps(2,end) .45s infinite}
.line.gusto-shiver .word.current{animation:gustoShiverCurrent .45s cubic-bezier(.16,1.3,.28,1) both,gustoShiverStrong .085s steps(2,end) .45s infinite}
@keyframes gustoShiverIn{0%{opacity:0;transform:translateY(22px) scale(.88)}70%{opacity:1;transform:translateY(-3px) scale(1.04)}100%{opacity:1;transform:none}}

@keyframes gustoShiverCurrent{0%,100%{transform:translateY(-.055em) scale(1.06)}}
@keyframes gustoShiverStrong{0%{transform:translate(-2px,-1px) rotate(-1.2deg) scale(1.06)}25%{transform:translate(2px,1px) rotate(1.3deg) scale(1.075)}50%{transform:translate(-2.5px,0) rotate(-1.5deg) scale(1.055)}75%{transform:translate(2px,-1px) rotate(1.1deg) scale(1.07)}100%{transform:translate(-1px,1px) rotate(-.8deg) scale(1.06)}}


.scratch-word{position:relative;display:inline-block;text-shadow:2px 1px 0 #fff2,-1px -1px 0 #0004}
.scratch-word::before,.scratch-word::after{content:"";position:absolute;left:-8%;width:116%;pointer-events:none;background:repeating-linear-gradient(164deg,transparent 0 5px,#f5e9df99 5px 7px,transparent 7px 11px);mix-blend-mode:screen}
.scratch-word::before{top:17%;height:28%;transform:rotate(-3deg) skewX(-12deg);opacity:.78}
.scratch-word::after{top:56%;height:23%;transform:rotate(2deg) skewX(9deg);opacity:.6}


.gusto-shiver .word.visible{animation:gustoShiver .105s steps(2,end) infinite}.gusto-shiver .word.current{animation:gustoShiverStrong .075s steps(2,end) infinite}.gusto-shiver .word:last-child{position:relative;z-index:4;font-size:1.45em;color:var(--accent);text-shadow:0 0 34px #ffb38a66;animation:ooForeground .52s ease-in-out infinite}
@keyframes gustoShiver{0%{transform:translate(-1px,0) rotate(-.7deg)}25%{transform:translate(1.5px,-.5px) rotate(.8deg)}50%{transform:translate(-1.5px,.6px) rotate(-.9deg)}75%{transform:translate(1px,-.4px) rotate(.7deg)}100%{transform:translate(-.5px,.2px) rotate(-.4deg)}}
@keyframes gustoShiverStrong{0%{transform:translate(-2px,-1px) rotate(-1.2deg) scale(1.05)}50%{transform:translate(2px,1px) rotate(1.3deg) scale(1.08)}100%{transform:translate(-2px,0) rotate(-1deg) scale(1.05)}}
@keyframes ooForeground{0%,100%{transform:scale(1.45) rotate(-1deg)}50%{transform:scale(1.62) rotate(1deg)}}

.subtle-kinetic .word.visible{animation:subtleKinetic 1.35s ease-in-out infinite}.subtle-kinetic .word.visible:last-child{animation:linyahanShake .18s steps(2,end) infinite;color:var(--accent)}

.clock-shake .word.visible{animation:clockLyricShake .14s steps(2,end) infinite}.clock-shake .clock-face{animation:clockFastSpin 2.4s linear infinite}.clock-shake .confetti,.clock-shake .particle,.clock-shake .spark{display:none!important}
@keyframes clockLyricShake{0%{transform:translate(-1px,0) rotate(-.5deg)}50%{transform:translate(1px,.5px) rotate(.6deg)}100%{transform:none}}@keyframes clockFastSpin{to{transform:rotate(360deg)}}
.standup-exit .word.current{animation:standUpHighlighted .32s cubic-bezier(.15,1.4,.3,1) both;transform-origin:50% 100%;z-index:5}

/* 3 — thinking words circle each other, but on a readable orbit */
.line.scene-orbit{position:relative;width:min(980px,94vw);height:min(52vh,440px);display:block}

/* 4 — build toward the "oo" like a rubber band */
.line.scene-stretch{gap:.06em .12em}

.line.scene-zoom{gap:.04em .10em}

.line.scene-question{gap:.12em;white-space:nowrap}

@keyframes qWord{0%{opacity:0;transform:translateY(55px) rotate(10deg) scale(.45)}70%{opacity:1;transform:translateY(-9px) rotate(-3deg) scale(1.12)}100%{opacity:1;transform:none}}

let current=-1,playing=false,lastBeat=-1,raf=0,scrubbing=false,heartCueShown=false;

function fmt(s){
  s=Math.max(0,s||0);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+
         String(Math.floor(s%60)).padStart(2,'0');
}
function cleanWord(w){
  return w.toLowerCase().replace(/[.,!?“”‘’"()]/g,'').trim();
}
function buildWords(text){
  const parts=text.split(/(\s+)/).filter(Boolean);
  let wordIndex=0;
  return parts.map(part=>{
    if(/^\s+$/.test(part)) return part;
    const raw=part;
    if(/kitaaaaa/i.test(raw)){
      const m=raw.match(/^(kita)(a+)$/i);
      if(m){
        const aCount=m[2].length;
        const trail=Array.from({length:aCount},(_,j)=>`<span class="trail-a ${j>0?'follow':''}" style="--a-i:${j}">a</span>`).join('');
        const html=`<span class="word long-word stretch" data-word-index="${wordIndex}" style="--i:${wordIndex};--tilt:0deg"><span class="kita">kita</span>${trail}</span>`;
        wordIndex++;
        return html;
      }
    }
    const isQuestionHindi=raw.toLowerCase()==='hindi?';
    const base=isQuestionHindi?'hindi':raw;
    const clean=cleanWord(base);
    const accent=accentWords.has(clean);
    const scratch=(clean==='gasgas' || clean==='banat');
    const tilt=[-2,1,-1,2,0][wordIndex%5];
    const classes=['word'];
    if(accent)classes.push('accent');
    if(scratch)classes.push('scratch-word');
    if(isQuestionHindi)classes.push('deny');
    const flyX=((wordIndex%2?-1:1)*(80+((wordIndex*47)%180)))+'px';
    const flyY=((wordIndex%3-1)*(70+((wordIndex*31)%150)))+'px';
    const flyR=((wordIndex%2?-1:1)*(8+(wordIndex%5)*7))+'deg';
    if(clean==='puso')classes.push('puso-word');
    if(clean==='gasgas')classes.push('gasgas-word');
    const html=`<span class="${classes.join(' ')}" data-word-index="${wordIndex}" style="--i:${wordIndex};--tilt:${tilt}deg;--fx:${flyX};--fy:${flyY};--fr:${flyR}">${base}</span>`;
    wordIndex++;
    if(isQuestionHindi) return html+'<span class="question-mark" data-question-index="'+(wordIndex-1)+'">?</span>';
    return html;
  }).join('');
}


function buildHeartSplitLine(text){
  const temp=document.createElement('div');
  temp.innerHTML=buildWords(text);
  const top=document.createElement('div');
  top.className='lyric-part top';
  const bottom=document.createElement('div');
  bottom.className='lyric-part heart-line';
  const field=document.createElement('div');
  field.className='heart-field';
  field.setAttribute('aria-hidden','true');
  bottom.appendChild(field);

  [...temp.childNodes].forEach(node=>{
    const word=node.nodeType===1 && node.classList.contains('word');
    const idx=word ? Number(node.dataset.wordIndex) : null;
    if(word && idx>=5){
      // Keep "sa puso mo" together while preserving their original cue indices.
      bottom.appendChild(node);
    }else{
      top.appendChild(node);
    }
  });

  // Put the heart emitter around the exact visual anchor for "puso".
  const puso=bottom.querySelector('.word[data-word-index="6"]');
  if(puso){
    const anchor=document.createElement('span');
    anchor.className='heart-anchor';
    puso.replaceWith(anchor);
    anchor.appendChild(puso);
  }
  const wrap=document.createDocumentFragment();
  wrap.appendChild(top);
  wrap.appendChild(bottom);
  return wrap;
}



function sceneFor(i){
  // Each lyric becomes a small motion-graphics scene.
  const scenes=[
    'fly','slit','crawl','wind','zoom','squiggle','clock','flip',
    'fly','question','crawl','slit','orbit','wind','rubber','chase',
    'longa','fly','clock','crawl','flip','zoom','question'
  ];
  return scenes[i]||'chase';
}

function buildClock(text){
  const nums=Array.from({length:12},(_,j)=>`<span class="clock-number" style="--n:${j}">${j+1}</span>`).join('');
  const ticks=Array.from({length:12},(_,j)=>`<i class="clock-tick" data-tick="${j}"></i>`).join('');
  const lyric=buildWords(text);
  return `<div class="clock-wrap"><div class="clock-face">${ticks}${nums}<div class="clock-hands"><i class="clock-hand hour"></i><i class="clock-hand minute"></i><i class="clock-hand second"></i><i class="clock-center"></i></div></div><div class="clock-lyric">${lyric}</div></div>`;
}

function layoutClock(){
  const el=L.querySelector('.line.active.scene-clock');
  if(!el)return;
  const face=el.querySelector('.clock-face');
  if(!face)return;
  const r=face.getBoundingClientRect().width*.44;
  el.querySelectorAll('.clock-number').forEach((n,i)=>{
    const a=(i/12)*Math.PI*2-Math.PI/2;
    n.style.transform=`translate(-50%,-50%) translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)`;
  });
  el.querySelectorAll('.clock-tick').forEach((tick,i)=>{
    const a=(i/12)*Math.PI*2;
    tick.style.transform=`translate(-50%,-50%) translate(${Math.cos(a)*r*.96}px,${Math.sin(a)*r*.96}px) rotate(${i*30}deg)`;
  });
}

function updateClock(t){
  const el=L.querySelector('.line.active');
  if(!el||!el.classList.contains('scene-clock'))return;
  const sec=((t%60)+60)%60;
  const minute=(t%3600)/60;
  const hour=(t%43200)/3600;
  const secondDeg=sec*6;
  const minuteDeg=minute*6;
  const hourDeg=hour*30;
  const second=el.querySelector('.clock-hand.second');
  const minuteH=el.querySelector('.clock-hand.minute');
  const hourH=el.querySelector('.clock-hand.hour');
  if(second)second.style.transform=`translate(-50%,-100%) rotate(${secondDeg}deg)`;
  if(minuteH)minuteH.style.transform=`translate(-50%,-100%) rotate(${minuteDeg}deg)`;
  if(hourH)hourH.style.transform=`translate(-50%,-100%) rotate(${hourDeg}deg)`;
}

function activate(i){
  if(i===current)return;
  const old=L.querySelector('.line.active');
  if(old){
    old.classList.remove('active');
    old.classList.add('out');
    setTimeout(()=>old.remove(),700);
  }
  current=i;
  heartCueShown=false;
  if(i<0){
    SEC.textContent='outro';
    return;
  }
  const item=lines[i];
  const scene=(i===0)?'heart-split':sceneFor(i);
  const qClass=item.text==='Oo o hindi?'?' scene-question':'';
  const body=scene==='clock'?buildClock(item.text):scene==='heart-split'?buildHeartSplitLine(item.text):buildWords(item.text);
  if(scene==='heart-split'){
    const el=document.createElement('div');
    el.className=`line motion scene-heart-split ${item.style}${qClass}`;
    el.dataset.index=i;
    const fragment=body;
    el.appendChild(fragment);
    L.replaceChildren(el);
  }else{
    const specialClass = i===0 ? ' puso-scene' : '';
  L.innerHTML=`<div class="line motion scene-${scene} ${item.style}${qClass}${specialClass}" data-index="${i}">${body}</div>`;
  }
  const el=L.firstElementChild;
  if(i===0) el.classList.add('puso-throb');
  if(i===3) el.classList.add('gusto-shiver');
  if(i===5) el.classList.add('subtle-kinetic');
  if(i===6) el.classList.add('clock-shake');
  if(i===7) el.classList.add('standup-exit');
  SEC.textContent=item.section;
  requestAnimationFrame(()=>{el.classList.add('active'); if(scene==='clock') layoutClock();});

  if(scene==='zoom'){
    el.classList.add('motion-zoom');
    setTimeout(()=>el.classList.remove('motion-zoom'),750);
  }
  if(scene==='bump') layoutBump(el);
  if(scene==='crawl') layoutCrawl(el);
  if(scene==='flip') layoutFlip(el);
}

function layoutBump(el){
  const words=[...el.querySelectorAll('.word')];
  words.forEach((w,i)=>{
    const sx=(i%2===0?-1:1)*(55+((i*29)%75));
    const sy=(i%3-1)*(28+((i*17)%45));
    const bx=(i%2===0?1:-1)*(2+(i%3)*2);
    const by=(i%2===0?-1:1)*(2+(i%3));
    w.style.setProperty('--sx',sx+'px');
    w.style.setProperty('--sy',sy+'px');
    w.style.setProperty('--sr',((i%2?-1:1)*(4+i))+'deg');
    w.style.setProperty('--bx',bx+'px');
    w.style.setProperty('--by',by+'px');
    w.style.setProperty('--br',((i%2?-1:1)*(1.5+i%3))+'deg');
  });
}


function layoutCrawl(el){
  const words=[...el.querySelectorAll('.word')];
  const n=Math.max(words.length,1);
  words.forEach((w,i)=>{
    const phase=(i/Math.max(n-1,1))*Math.PI*2;
    w.style.setProperty('--crawl-phase',phase);
    w.style.setProperty('--crawl-i',i);
  });
}

function layoutFlip(el){
  [...el.querySelectorAll('.word')].forEach((w,i)=>{
    w.style.setProperty('--flip-y',((i%2)*1.1)+'em');
    w.style.setProperty('--flip-z',((i%2?-1:1)*(4+i%4))+'deg');
  });
}

function updateWords(t){
  const el=L.querySelector('.line.active');
  if(!el||current<0)return;
  const item=lines[current];
  const words=[...el.querySelectorAll('.word')];
  const cues=item.cues;
  let currentWord=-1;

  words.forEach((w,i)=>{
    const start=cues[i] ?? (item.start+(i/words.length)*(item.end-item.start));
    const visible=t>=start;
    w.classList.toggle('visible',visible);
    if(visible)currentWord=i;
  });
  words.forEach((w,i)=>w.classList.toggle('current',i===currentWord));

  const q=el.querySelector('.question-mark');
  if(q){
    const hindi=el.querySelector('.word.deny');
    const hindiIndex=Number(hindi?.dataset.wordIndex ?? -1);
    const hindiCue=cues[hindiIndex] ?? item.start;
    const qVisible=t>=hindiCue;
    q.classList.toggle('visible',qVisible);
    if(hindi)hindi.classList.toggle('crossed',qVisible);
  }

}

function updateMotion(t){
  const el=L.querySelector('.line.active');
  if(!el||current<0)return;
  const item=lines[current];
  const scene=sceneFor(current);
  const words=[...el.querySelectorAll('.word')];

  if(scene==='orbit'){
    const n=words.length;
    const rx=Math.min(310,185+n*13);
    const ry=Math.min(205,112+n*7);
    words.forEach((w,i)=>{
      const base=(-Math.PI/2)+(i/n)*Math.PI*2;
      const a=base+t*.72;
      const x=Math.cos(a)*rx;
      const y=Math.sin(a)*ry;
      const scale=w.classList.contains('current')?1.13:1;
      const rot=Math.sin(a)*5;
      w.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),0) rotate(${rot}deg) scale(${scale})`;
    });
  }

  if(scene==='crawl'){
    const n=Math.max(words.length,1);
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const phase=(i/Math.max(n,1))*Math.PI*2 + t*1.45;
      const x=Math.sin(phase)*Math.min(240,105+n*13);
      const y=Math.sin(phase*2)*Math.min(105,42+n*6);
      const rot=Math.sin(phase)*10;
      const scale=1+.05*Math.sin(phase*2+t*2);
      w.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),0) rotate(${rot}deg) scale(${scale})`;
    });
  }
  if(scene==='fly'){
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const drift=Math.sin(t*1.7+i*.8)*4;
      const sway=Math.cos(t*1.15+i*.55)*2.5;
      const idleX=Math.sin(t*5.4+i*.9)*1.8;
      const idleY=Math.cos(t*5.4+i*1.1)*1.4;
      const idleR=Math.sin(t*5.4+i)*.75;
      w.style.translate=`${sway+idleX}px ${drift+idleY}px`;
      w.style.rotate=`${Math.sin(t*1.25+i)*2.2+idleR}deg`;
      w.style.scale=`${1+0.012*Math.sin(t*5.4+i)}`;
    });
  }
  if(scene==='flip'){
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const bob=Math.sin(t*3.2+i*.7)*2.5;
      const tilt=Math.sin(t*2.1+i)*1.5;
      const idleX=Math.sin(t*5.4+i*.9)*1.8;
      const idleY=Math.cos(t*5.4+i*1.1)*1.4;
      const idleR=Math.sin(t*5.4+i)*.75;
      w.style.translate=`${idleX}px ${bob+idleY}px`;
      w.style.rotate=`${tilt+idleR}deg`;
      w.style.scale=`${1+0.012*Math.sin(t*5.4+i)}`;
    });
  }
  if(scene==='rubber'){
    words.forEach((w,i)=>{
      if(!w.classList.contains('visible'))return;
      const s=1+.055*Math.sin(t*4+i*.9);
      const sx=s*(1+.12*Math.sin(t*2.3+i));
      const sy=s*(1-.08*Math.sin(t*2.3+i));
      w.style.transform=`scaleX(${sx}) scaleY(${sy}) rotate(${Math.sin(t*2+i)*1.5}deg)`;
    });
  }
  if(scene==='question'){
    const oo=words[0];
    if(oo) oo.style.transform=`translateY(${Math.sin(t*7)*3}px) scale(${1.02+.035*Math.max(0,Math.sin(t*4))})`;
  }

  // Extra idle heartbeat for every scene, layered through independent transform properties.
  words.forEach((w,i)=>{
    if(!w.classList.contains('visible'))return;
    if(scene==='fly' || scene==='flip')return; // already composed above
    const idleX=Math.sin(t*5.4+i*.9)*1.8;
    const idleY=Math.cos(t*5.4+i*1.1)*1.4;
    const idleR=Math.sin(t*5.4+i)*.75;
    w.style.translate=`${idleX}px ${idleY}px`;
    w.style.rotate=`${idleR}deg`;
    w.style.scale=`${1+0.012*Math.sin(t*5.4+i)}`;
  });
}

function pulse(t){
  const beat=60/123.046875;
  const idx=Math.floor((t-0.197)/beat);
  if(idx>lastBeat&&idx>=0){
    lastBeat=idx;
    APP.classList.add('beat');
    FLASH.classList.add('hit');
    setTimeout(()=>APP.classList.remove('beat'),90);
    setTimeout(()=>FLASH.classList.remove('hit'),150);
    if(idx%8===0)echo();
  }
}

function echo(){
  const e=document.createElement('div');
  e.className='echo show';
  e.textContent=['LIGAWAN?','OO O HINDI?','GUSTO KITA','PUSO MO'][Math.floor(Math.random()*4)];
  e.style.left=(10+Math.random()*70)+'%';
  e.style.top=(20+Math.random()*60)+'%';
  e.style.fontSize=(20+Math.random()*80)+'px';
  e.style.setProperty('--dx',(Math.random()*180-90)+'px');
  e.style.setProperty('--dy',(Math.random()*180-90)+'px');
  e.style.setProperty('--r',(Math.random()*18-9)+'deg');
  E.appendChild(e);
  setTimeout(()=>e.remove(),1200);
}

function updateSpecialVisuals(t){
  const firstWasActive = current===0;
  if(firstWasActive && t>=11.680 && t<12.430 && !window._pusoHeartBurst){
    window._pusoHeartBurst=true;
    spawnPusoHearts();
  }
  if(!firstWasActive) window._pusoHeartBurst=false;

  // The requested echo occurs during 00:21–00:23 (21.0–23.0s).
  const inBanatEcho=(t>=21 && t<23.5);
  if(inBanatEcho && !window._banatEchoStarted){
    window._banatEchoStarted=true;
    spawnBanatEcho();
    setTimeout(spawnBanatEcho,420);
    setTimeout(spawnBanatEcho,900);
  }
  if(!inBanatEcho) window._banatEchoStarted=false;
}


let ooTakeoverActive=false;
let ooHeartBurstActive=false;
function clearOoTakeover(){const field=document.querySelector('#ooExplosion');if(field)field.replaceChildren();ooTakeoverActive=false;ooHeartBurstActive=false}
function spawnOoTakeover(){const field=document.querySelector('#ooExplosion');if(!field||ooTakeoverActive)return;ooTakeoverActive=true;const fonts=['Arial Black, Impact, sans-serif','Georgia, serif','Times New Roman, serif','Courier New, monospace','Trebuchet MS, sans-serif','Verdana, sans-serif','Palatino Linotype, serif','Impact, sans-serif'];for(let i=0;i<30;i++){const e=document.createElement('div');e.className='oo-field';e.textContent='Oo';e.style.fontFamily=fonts[Math.floor(Math.random()*fonts.length)];e.style.fontSize=(26+Math.random()*150)+'px';e.style.setProperty('--r',(-16+Math.random()*32)+'deg');e.style.setProperty('--r2',(-30+Math.random()*60)+'deg');e.style.setProperty('--dx',(-55+Math.random()*110)+'vw');e.style.setProperty('--dy',(-55+Math.random()*110)+'vh');e.style.setProperty('--scale',(0.8+Math.random()*2.4).toFixed(2));e.style.setProperty('--life',(1.05+Math.random()*.55)+'s');const a=(i/30)*Math.PI*2;const radius=20+Math.random()*42;e.style.left=(50+Math.cos(a)*radius)+'%';e.style.top=(50+Math.sin(a)*radius)+'%';field.appendChild(e)}const wipe=document.createElement('div');wipe.className='oo-field wipe';wipe.textContent='Oo';wipe.style.fontFamily=fonts[Math.floor(Math.random()*fonts.length)];wipe.style.fontSize='clamp(90px,28vw,420px)';wipe.style.setProperty('--r','0deg');wipe.style.setProperty('--life','1.15s');field.appendChild(wipe)}
function explodeOoIntoHearts(){const field=document.querySelector('#ooExplosion');if(!field||ooHeartBurstActive)return;ooHeartBurstActive=true;for(let i=0;i<34;i++){const h=document.createElement('span');h.className='oo-heart';const a=(Math.PI*2/34)*i+(Math.random()-.5)*.4;const distance=100+Math.random()*330;h.style.setProperty('--size',(7+Math.random()*25)+'px');h.style.setProperty('--dx',(Math.cos(a)*distance)+'px');h.style.setProperty('--dy',(Math.sin(a)*distance)+'px');h.style.setProperty('--rot',(-35+Math.random()*70)+'deg');h.style.setProperty('--life',(0.65+Math.random()*.65)+'s');h.style.color=`hsl(${5+Math.random()*40},${65+Math.random()*25}%,${65+Math.random()*20}%)`;field.appendChild(h)}setTimeout(clearOoTakeover,1450)}


let pusoBgActive=false;
function clearPusoBackground(){const f=document.querySelector('#heartField');if(f)f.querySelectorAll('.puso-bg-heart').forEach(h=>h.remove());pusoBgActive=false}
function spawnPusoBackground(){const f=document.querySelector('#heartField');if(!f||pusoBgActive)return;pusoBgActive=true;for(let i=0;i<24;i++){const h=document.createElement('span');h.className='puso-bg-heart';h.style.setProperty('--size',(14+Math.random()*58)+'px');h.style.setProperty('--x',(2+Math.random()*96)+'%');h.style.setProperty('--y',(4+Math.random()*90)+'%');h.style.setProperty('--life',(1.1+Math.random()*1.8)+'s');h.style.color=`hsl(${5+Math.random()*35},60%,70%)`;f.appendChild(h)}}

let pusoBurstActive=false;
let banatEchoActive=false;

function clearPusoHearts(){
  const field=document.querySelector('#heartField');
  if(field) field.replaceChildren();
  pusoBurstActive=false;
}

function spawnPusoHearts(){
  const field=document.querySelector('#heartField');
  if(!field || pusoBurstActive) return;
  pusoBurstActive=true;

  // Burst around the center of the lyric, then disappear like bubbles.
  const count=22;
  for(let i=0;i<count;i++){
    const h=document.createElement('span');
    h.className='puso-heart';
    h.textContent='♥';

    const angle=(Math.PI*2/count)*i + (Math.random()-.5)*.55;
    const distance=70 + Math.random()*210;
    const size=8 + Math.random()*22;

    h.style.setProperty('--size',size+'px');
    h.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');
    h.style.setProperty('--dy',(Math.sin(angle)*distance - 35 - Math.random()*80)+'px');
    h.style.setProperty('--rot',(-35+Math.random()*70)+'deg');
    h.style.setProperty('--life',(0.75+Math.random()*0.65)+'s');
    h.style.color=`hsl(${5+Math.random()*35}, ${65+Math.random()*25}%, ${65+Math.random()*20}%)`;

    // Start from the center of the lyric stage.
    h.style.left='50%';
    h.style.top='50%';

    field.appendChild(h);
  }

  // The field is completely cleared after the burst.
  setTimeout(clearPusoHearts,1550);
}

function clearBanatEchoes(){
  const field=document.querySelector('#backgroundBanat');
  if(field) field.replaceChildren();
  banatEchoActive=false;
}

function spawnBanatEchoes(){
  const field=document.querySelector('#backgroundBanat');
  if(!field || banatEchoActive) return;
  banatEchoActive=true;

  const fonts=[
    'Arial Black, sans-serif',
    'Georgia, serif',
    'Impact, sans-serif',
    'Trebuchet MS, sans-serif',
    'Courier New, monospace',
    'Times New Roman, serif',
    'Verdana, sans-serif'
  ];

  const count=18;
  for(let i=0;i<count;i++){
    const e=document.createElement('div');
    e.className='banat-echo';
    e.textContent="banat na 'to";

    e.style.left=(5+Math.random()*90)+'%';
    e.style.top=(8+Math.random()*84)+'%';
    e.style.fontFamily=fonts[Math.floor(Math.random()*fonts.length)];
    e.style.fontSize=(18+Math.random()*76)+'px';
    e.style.setProperty('--rot',(-18+Math.random()*36)+'deg');
    e.style.setProperty('--dx',(-35+Math.random()*70)+'px');
    e.style.setProperty('--dy',(-25+Math.random()*50)+'px');
    e.style.setProperty('--alpha',(0.055+Math.random()*0.105).toFixed(3));
    e.style.setProperty('--life',(1.35+Math.random()*0.75)+'s');

    field.appendChild(e);
  }

  // Nothing remains after the 21–23 second echo window.
  setTimeout(clearBanatEchoes,2150);
}

function render(){
  if((A.currentTime||0)>=135){A.currentTime=135;A.pause();}
  const t=Math.min(A.currentTime||0,135);
  const i=lines.findIndex(x=>t>=x.start&&t<x.end);
  activate(i);

  // Time-locked visual effects:
  // PUSO burst only during the PUSO cue (11.680s–12.430s).
  if(t>=11.680 && t<12.430){
    spawnPusoBackground();
    if(!pusoBurstActive) spawnPusoHearts();
  }else{
    if(pusoBurstActive) clearPusoHearts();
    if(pusoBgActive) clearPusoBackground();
  }


  if(t>=36.42 && t<39.35){if(!ooTakeoverActive)spawnOoTakeover();if(t>=38.65&&!ooHeartBurstActive)explodeOoIntoHearts()}else if(ooTakeoverActive||ooHeartBurstActive){clearOoTakeover()}

  // "banat na 'to" exists ONLY from 00:21.000 through 00:23.499.
  // Clear first so seeking backward/forward can never leave stale echoes.
  if(t>=21 && t<23.5){
    if(!banatEchoActive) spawnBanatEchoes();
  }else{
    clearBanatEchoes();
  }

  updateWords(t);
  updateMotion(t);
  updateClock(t);
  pulse(t);
const d=Math.min(A.duration||135,135);
  P.style.width=Math.min(100,(t/d)*100)+'%';
  T.textContent=fmt(t);
  C.textContent=fmt(t)+' / '+fmt(d);

  const beatPhase=((t-0.197)/(60/123.046875))%1;
  const breathe=1+Math.max(0,1-Math.abs(beatPhase-.5)*2)*.022;
  O1.style.transform=`translate(var(--mx),var(--my)) scale(${breathe})`;
  O2.style.transform=`translate(calc(var(--mx) * -.6),calc(var(--my) * -.6)) scale(${1+(breathe-.978)*2})`;
  document.documentElement.style.setProperty('--x',(50+Math.sin(t*.7)*12)+'%');
  document.documentElement.style.setProperty('--y',(50+Math.cos(t*.53)*10)+'%');

  raf=requestAnimationFrame(render);
}

async function play(){
  try{
    await A.play();
  }catch(err){
    console.error('Audio playback failed:',err);
    TOGGLE.textContent='▶';
    document.querySelector('#hint .play').textContent='Tap again to play';
  }
}
function pause(){A.pause()}

A.addEventListener('play',()=>{
  playing=true;APP.classList.add('playing');TOGGLE.textContent='❚❚';
});
A.addEventListener('pause',()=>{
  playing=false;APP.classList.remove('playing');TOGGLE.textContent='▶';
});
A.addEventListener('ended',()=>{
  playing=false;APP.classList.remove('playing');TOGGLE.textContent='▶';
  lastBeat=-1;current=-1;activate(-1);
});
A.addEventListener('loadedmetadata',()=>{
  C.textContent='00:00 / '+fmt(Math.min(A.duration||135,135));
});

function seekFromClientX(x){
  if(!A.duration)return;
  const r=TRACK.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(x-r.left)/r.width));
  A.currentTime=ratio*A.duration;
  SCRUB.textContent=fmt(A.currentTime);
}
TRACK.addEventListener('pointerdown',e=>{
  scrubbing=true;APP.classList.add('scrubbing');
  TRACK.setPointerCapture?.(e.pointerId);
  seekFromClientX(e.clientX);
});
TRACK.addEventListener('pointermove',e=>{
  if(scrubbing)seekFromClientX(e.clientX);
});
TRACK.addEventListener('pointerup',e=>{
  scrubbing=false;APP.classList.remove('scrubbing');
  seekFromClientX(e.clientX);
});
TRACK.addEventListener('pointercancel',()=>{
  scrubbing=false;APP.classList.remove('scrubbing');
});

document.querySelector('#start').addEventListener('click',play);
TOGGLE.addEventListener('click',()=>A.paused?play():pause());

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();A.paused?play():pause();}
  if(e.code==='ArrowRight')A.currentTime=Math.min(A.duration||135,135,A.currentTime+5);
  if(e.code==='ArrowLeft')A.currentTime=Math.max(0,A.currentTime-5);
});

APP.addEventListener('pointermove',e=>{
  const x=(e.clientX/innerWidth-.5)*14;
  const y=(e.clientY/innerHeight-.5)*14;
  document.documentElement.style.setProperty('--mx',x+'px');
  document.documentElement.style.setProperty('--my',y+'px');
});
APP.addEventListener('pointerleave',()=>{
  document.documentElement.style.setProperty('--mx','0px');
  document.documentElement.style.setProperty('--my','0px');
});
render();
</script>
